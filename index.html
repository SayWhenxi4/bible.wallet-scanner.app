// ==================== ECHOCHIASM STUDY ====================

// A heuristic backstop for detecting a truncated study note. stop_reason
// from the API is the authoritative signal when the response was cut off
// by hitting the token ceiling — but a response can also come back
// genuinely incomplete for other reasons stop_reason won't flag (e.g. an
// upstream connection issue that still yields a well-formed but short API
// response). This catches that case too: a real note always closes with
// its Application section, ending in real sentence-final punctuation —
// anything that doesn't is almost certainly cut short, regardless of what
// stop_reason claims.
// Same idea as looksIncomplete, but for the book-overview format, which
// closes with "Central Thread ❤️" rather than "Application ❓".
function looksIncompleteOverview(text) {
  if (!text) return true;
  const trimmed = text.trim();
  const hasCentralThread = /Central Thread\s*❤️/.test(trimmed);
  const endsCleanly = /[.!?"'”’)]\s*$/.test(trimmed);
  return !hasCentralThread || !endsCleanly;
}

// Same idea as looksIncomplete, but for Ask AI's free-form spoken answers,
// which have no fixed closing section to check for — conversational prose
// doesn't end with an "Application" header the way a study note does. The
// only reliable signal here is whether the response actually ends on real
// sentence-final punctuation rather than stopping mid-word or mid-clause.
function looksIncompleteAnswer(text) {
  if (!text) return true;
  return !/[.!?"'”’)]\s*$/.test(text.trim());
}

function looksIncomplete(text) {
  if (!text) return true;
  const trimmed = text.trim();
  const hasApplicationSection = /Application\s*❓/.test(trimmed);
  const endsCleanly = /[.!?"'”’)]\s*$/.test(trimmed);
  return !hasApplicationSection || !endsCleanly;
}

function extractRef(text) {
  const firstLine = text.trim().split('\n')[0] || '';
  const match = firstLine.match(/^[A-Za-zÀ-ÿ0-9\s]+?\d+:\d+(-\d+)?/);
  return match ? match[0].trim() : firstLine.slice(0, 40).trim();
}

// Normalizes a reference string into a stable lookup key, e.g.
// "Genesis 1:2 KJV (public domain)" -> "en:genesis 1:2"
// Strips translation labels/parentheticals so the same passage matches
// regardless of exactly how the reference line was phrased.
function normalizeRefKey(refString, lang) {
  if (!refString) return null;
  let s = refString.toLowerCase();
  s = s.replace(/\(.*?\)/g, '');                    // drop "(public domain)" etc.
  s = s.replace(/\b(kjv|nkjv|rv1909|reina-valera[^,]*|reina valera[^,]*)\b/g, ''); // drop version labels
  s = s.replace(/[.,;]+$/g, '');
  s = s.replace(/\s+/g, ' ').trim();
  const match = s.match(/^((?:[1-3]\s+)?[a-zà-ÿ\s]+?)\s+(\d+):(\d+(?:-\d+)?)/);
  if (!match) return null;
  const book = match[1].trim().replace(/\s+/g, ' ');
  return `${lang}:${book} ${match[2]}:${match[3]}`;
}

function getCommentaryIndex() {
  try {
    const raw = localStorage.getItem('echochiasm_commentary_index');
    return raw ? JSON.parse(raw) : {};
  } catch (e) { return {}; }
}
function saveCommentaryIndex(idx) {
  localStorage.setItem('echochiasm_commentary_index', JSON.stringify(idx));
}
function indexCommentaryEntry(refKey, storageKey) {
  if (!refKey) return;
  const idx = getCommentaryIndex();
  idx[refKey] = storageKey;
  saveCommentaryIndex(idx);
}
let pendingStudyOrigin = null; // set by "Send to Study"; cleared on manual textarea edits

// Builds the same canonical key format as normalizeRefKey, but directly
// from known-good structured data (book/chapter/verse indices) instead of
// re-parsing freeform text — used whenever the passage came from selecting
// verses in the reader, since that's exact and never ambiguous.
function structuredRefKey(origin) {
  if (!origin || !bookMeta) return null;
  const m = bookMeta[origin.bookIndex];
  if (!m) return null;
  const book = (origin.lang === 'es' ? m.es : m.en).toLowerCase();
  const nums = origin.verseNums;
  const range = nums.length === 1
    ? String(nums[0])
    : (isContiguous(nums) ? `${nums[0]}-${nums[nums.length - 1]}` : nums.join(','));
  return `${origin.lang}:${book} ${origin.chapterIndex + 1}:${range}`;
}

function findExistingStudy(refKey) {
  if (!refKey) return null;
  const idx = getCommentaryIndex();
  const storageKey = idx[refKey];
  if (!storageKey) return null;
  return getStudy(storageKey);
}

// Finds any previously-generated EchoChiasm study notes whose reference
// falls within the given chapter (same book, same chapter, any verse
// range) — used by Ask AI so its spoken answers can draw on analysis
// already done for this passage instead of starting from bare verse text
// every time. Scoped to the given language, since a saved note's language
// should match what's being asked about. Dedupes by storage key, since a
// single study is often indexed under more than one ref key (see the
// "Index under every reliable key we can derive" comment in
// generateEchoChiasm) — without this, the same note could get pulled in
// twice and double up in the context sent to the model.
function findStudiesForChapter(bookIndex, chapterIndex, lang) {
  if (!bookMeta) return [];
  const m = bookMeta[bookIndex];
  if (!m) return [];
  const bookNameLower = (lang === 'es' ? m.es : m.en).toLowerCase();
  const prefix = `${lang}:${bookNameLower} ${chapterIndex + 1}:`;
  const idx = getCommentaryIndex();
  const seenStorageKeys = new Set();
  const matches = [];
  for (const refKey of Object.keys(idx)) {
    if (!refKey.startsWith(prefix)) continue;
    const storageKey = idx[refKey];
    if (seenStorageKeys.has(storageKey)) continue;
    seenStorageKeys.add(storageKey);
    const study = getStudy(storageKey);
    if (study && study.text) matches.push(study.text);
  }
  return matches;
}

// Matches a book name (as it appears in a saved ref string) against
// bookMeta to get its canonical position, so the library can sort in
// actual Bible order rather than by save date.
function matchBookIndex(bookNameLower) {
  if (!bookMeta) return -1;
  for (const m of bookMeta) {
    if (m.en.toLowerCase() === bookNameLower || m.es.toLowerCase() === bookNameLower) return m.i;
  }
  return -1;
}

// Book overviews are indexed with a sentinel key — a colon before
// "overview" instead of a chapter:verse pattern — so they can never
// collide with a real study's ref key, while still living in the same
// flat commentaryIndex/localStorage system as everything else.
function bookOverviewRefKey(bookIndex, lang) {
  if (!bookMeta) return null;
  const m = bookMeta[bookIndex];
  if (!m) return null;
  const bookNameLower = (lang === 'es' ? m.es : m.en).toLowerCase();
  return `${lang}:${bookNameLower}:overview`;
}

function findBookOverview(bookIndex, lang) {
  const refKey = bookOverviewRefKey(bookIndex, lang);
  return findExistingStudy(refKey);
}

// Pulls the bullet-point references out of a study's own Echoes section
// (e.g. "• Genesis 45:5-8 — ..." -> {book:'Genesis', chapter:45}), so
// findRelatedByEchoes can follow them outward to other saved studies.
// Sections in a study are separated by exactly one blank line (see the
// OUTPUT FORMAT rule), so splitting on blank lines isolates the Echoes
// block cleanly without needing to know what section follows it.
function parseEchoesReferences(studyText) {
  const blocks = studyText.split(/\n\s*\n/);
  const echoesBlock = blocks.find(b => b.trim().startsWith('Echoes'));
  if (!echoesBlock) return [];
  const refs = [];
  const lineRe = /^•\s*([A-Za-zÀ-ÿ\s]+?)\s+(\d+):(\d+(?:-\d+)?)/;
  echoesBlock.split('\n').forEach(line => {
    const m = line.match(lineRe);
    if (m) refs.push({ book: m[1].trim(), chapter: parseInt(m[2], 10) });
  });
  return refs;
}

// For the passage currently being discussed, follows every reference in
// its own studies' Echoes sections outward and pulls in any OTHER saved
// study that exists for that referenced chapter — e.g. Revelation 22's
// note echoes Genesis 2-3; if a Genesis 2 study exists, its content comes
// along too, letting Ask AI follow a real cross-reference thread across
// the whole library instead of being limited to the current chapter.
// Deduped by storage key, and never re-includes the current chapter's
// own notes (already passed in as ownTexts, and excluded here so they
// don't get counted a second time as "related").
function findRelatedByEchoes(bookIndex, chapterIndex, lang, ownTexts) {
  if (!bookMeta) return [];
  const idx = getCommentaryIndex();
  const seenStorageKeys = new Set();

  const ownPrefix = (() => {
    const m = bookMeta[bookIndex];
    if (!m) return null;
    const bookNameLower = (lang === 'es' ? m.es : m.en).toLowerCase();
    return `${lang}:${bookNameLower} ${chapterIndex + 1}:`;
  })();
  if (ownPrefix) {
    Object.keys(idx).forEach(k => { if (k.startsWith(ownPrefix)) seenStorageKeys.add(idx[k]); });
  }

  const related = [];
  ownTexts.forEach(text => {
    parseEchoesReferences(text).forEach(({ book, chapter }) => {
      const refBookIndex = matchBookIndex(book.toLowerCase());
      if (refBookIndex === -1) return;
      if (refBookIndex === bookIndex && (chapter - 1) === chapterIndex) return; // don't link a chapter to itself
      const m2 = bookMeta[refBookIndex];
      if (!m2) return;
      const bookNameLower2 = (lang === 'es' ? m2.es : m2.en).toLowerCase();
      const prefix2 = `${lang}:${bookNameLower2} ${chapter}:`;
      Object.keys(idx).forEach(k => {
        if (!k.startsWith(prefix2)) return;
        const storageKey = idx[k];
        if (seenStorageKeys.has(storageKey)) return;
        seenStorageKeys.add(storageKey);
        const study = getStudy(storageKey);
        if (study && study.text) related.push(study.text);
      });
    });
  });
  return related;
}

function parseRefForSort(refString) {
  if (!refString) return { bookIndex: 999, chapter: 0, verse: 0 };
  let s = refString.toLowerCase();
  s = s.replace(/\(.*?\)/g, '');
  s = s.replace(/\b(kjv|nkjv|rv1909|reina-valera[^,]*|reina valera[^,]*)\b/g, '');
  s = s.replace(/\s+/g, ' ').trim();
  const match = s.match(/^((?:[1-3]\s+)?[a-zà-ÿ\s]+?)\s+(\d+):(\d+)/);
  if (!match) return { bookIndex: 999, chapter: 0, verse: 0 };
  const bookIndex = matchBookIndex(match[1].trim());
  return {
    bookIndex: bookIndex >= 0 ? bookIndex : 999,
    chapter: parseInt(match[2], 10),
    verse: parseInt(match[3], 10)
  };
}

async function openCommentaryLibrary() {
  await ensureBookMeta();
  document.getElementById('commentary-library-title').textContent = s().commentaryLibraryLabel;
  const listEl = document.getElementById('commentary-library-list');
  const idx = getCommentaryIndex();
  const storageKeys = Object.values(idx);

  if (storageKeys.length === 0) {
    listEl.innerHTML = `<div class="empty-note">${s().noCommentaryEntries}</div>`;
    openOverlay('commentary-library-overlay');
    return;
  }

  const entries = storageKeys.map(key => {
    const parsed = getStudy(key);
    if (!parsed) return null;
    return { key, ...parsed, sort: parseRefForSort(parsed.ref) };
  }).filter(Boolean).filter(entry => entry.lang === currentLang);

  if (entries.length === 0) {
    listEl.innerHTML = `<div class="empty-note">${s().noCommentaryEntries}</div>`;
    openOverlay('commentary-library-overlay');
    return;
  }

  entries.sort((a, b) => {
    if (a.sort.bookIndex !== b.sort.bookIndex) return a.sort.bookIndex - b.sort.bookIndex;
    if (a.sort.chapter !== b.sort.chapter) return a.sort.chapter - b.sort.chapter;
    return a.sort.verse - b.sort.verse;
  });

  listEl.innerHTML = entries.map(entry => `
    <div class="history-item" data-key="${encodeURIComponent(entry.key)}">
      <span class="ref">${escapeHtml(entry.ref || 'Untitled')}</span>
    </div>
  `).join('');

  listEl.querySelectorAll('.history-item').forEach(el => {
    el.addEventListener('click', async () => {
      const key = decodeURIComponent(el.dataset.key);
      const parsed = getStudy(key);
      if (!parsed) return;
      closeOverlay('commentary-library-overlay');
      if (parsed.lang !== currentLang) await setLang(parsed.lang);
      switchView('study');
      renderOutput(parsed.text);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });

  openOverlay('commentary-library-overlay');
}

document.getElementById('commentary-library-back').onclick = () => { closeOverlay('commentary-library-overlay'); openOverlay('menu-overlay'); };
document.getElementById('commentary-library-close').onclick = () => closeOverlay('commentary-library-overlay');
document.getElementById('commentary-library-overlay').addEventListener('click', (e) => { if (e.target.id === 'commentary-library-overlay') closeOverlay('commentary-library-overlay'); });
document.getElementById('menu-commentary-row').onclick = () => {
  closeOverlay('menu-overlay');
  openCommentaryLibrary();
};

async function generateEchoChiasm(forceRegenerate) {
  const inputEl = document.getElementById('input-text');
  const text = inputEl.value.trim();
  const errorSlot = document.getElementById('error-slot');
  const outputSlot = document.getElementById('output-slot');
  const sealBtn = document.getElementById('seal-btn');
  const statusText = document.getElementById('status-text');

  errorSlot.innerHTML = '';
  if (!text) { errorSlot.innerHTML = `<div class="error-box">${s().emptyInputError}</div>`; return; }

  // A bare book name (exactly matching a known book, nothing else — no
  // chapter, no verse) means the person wants a whole-book overview, not
  // a per-passage study. matchBookIndex does exact equality against known
  // book names, so this correctly still routes numbered books like
  // "1 Peter" or "2 Corinthians" here — an earlier version of this check
  // used "does the input contain any digit at all," which broke on
  // exactly those books, since their own names contain a digit that isn't
  // a chapter reference.
  const bareBookIndex = matchBookIndex(text.toLowerCase());
  if (bareBookIndex !== -1) {
    await generateBookOverview(bareBookIndex, forceRegenerate);
    return;
  }

  // Check the local library first — no need to spend tokens re-generating
  // a study you already have saved for this exact passage. Prefer the
  // structured key (exact, from the reader's own selection) over the
  // text-parsed one, which is only a fallback for freely typed/pasted text.
  if (!forceRegenerate) {
    const structuredKey = structuredRefKey(pendingStudyOrigin);
    const textKey = normalizeRefKey(extractRef(text), currentLang);
    const existing = findExistingStudy(structuredKey) || findExistingStudy(textKey);
    if (existing) {
      renderOutput(existing.text, { fromLibrary: true });
      return;
    }
  }

  const apiKey = getApiKey();
  if (!hasAIConnection()) { errorSlot.innerHTML = `<div class="error-box">${s().noKeyError}</div>`; return; }

  sealBtn.disabled = true;
  sealBtn.classList.add('spinning');
  statusText.textContent = s().generating;
  outputSlot.innerHTML = '';

  const systemPrompt = currentLang === 'es' ? SYSTEM_PROMPT_ES : SYSTEM_PROMPT_EN;

  try {
    // Explicit high ceiling — the default 1500 is plenty for a single short
    // verse but genuinely too small for the full EchoChiasm format (Structure,
    // 4 Echoes with explanations, Hebrew/Greek insights, Theological Heart,
    // Application) on a richer or multi-verse passage, causing generation to
    // truncate mid-sentence. This costs nothing extra unless a study actually
    // needs the room — max_tokens is a ceiling, not a target.
    //
    // Even with that high ceiling, a response can still occasionally come
    // back cut short — either because stop_reason genuinely says
    // 'max_tokens' (rare at this ceiling, but possible on an unusually
    // long chapter), or because of some other interruption that still
    // yields a well-formed but incomplete response. Previously there was
    // no way to tell the difference between that and a real, complete
    // note — a truncated response just silently got saved and shown as
    // if it were finished. Now: check stop_reason AND the completeness
    // heuristic, and retry once (at a higher ceiling, in case it really
    // was max_tokens) before accepting what came back.
    let { text: resultText, stopReason } = await callAI(apiKey, text, systemPrompt, DEFAULT_CLOUD_MODEL, 4096, currentLang === 'es' ? 'study_es' : 'study_en');
    if (!resultText) throw new Error("Empty response");
    if (stopReason === 'max_tokens' || looksIncomplete(resultText)) {
      statusText.textContent = s().retryingIncomplete || s().generating;
      const retry = await callAI(apiKey, text, systemPrompt, DEFAULT_CLOUD_MODEL, 8192, currentLang === 'es' ? 'study_es' : 'study_en');
      if (retry.text && !looksIncomplete(retry.text)) {
        resultText = retry.text;
      } else if (retry.text && retry.text.length > resultText.length) {
        // Still not clean by the heuristic, but strictly more complete than
        // the first attempt — better to show the fuller version than the
        // shorter one, while still flagging it below.
        resultText = retry.text;
      }
    }
    const stillIncomplete = looksIncomplete(resultText);
    const ref = extractRef(resultText) || extractRef(text);
    renderOutput(resultText);
    playChime('complete');
    if (stillIncomplete) {
      errorSlot.innerHTML = `<div class="error-box">${s().incompleteNoteWarning}</div>`;
    }
    const savedKey = await saveToHistory(ref, resultText, currentLang);
    // Index under every reliable key we can derive — not just Claude's own
    // header text, which is what was still causing mismatches. The input
    // text itself is authoritative (it's either our own reliably-formatted
    // "Send to Study" line, or exactly what the user typed), so it's
    // indexed unconditionally here rather than depending on a value that
    // has to survive an entire async round-trip untouched.
    if (savedKey) {
      const inputTextKey = normalizeRefKey(extractRef(text), currentLang);
      if (inputTextKey) indexCommentaryEntry(inputTextKey, savedKey);
      const structuredKey = structuredRefKey(pendingStudyOrigin);
      if (structuredKey) indexCommentaryEntry(structuredKey, savedKey);
    }
    refreshHistoryIfVisible();
  } catch (err) {
    errorSlot.innerHTML = `<div class="error-box">${s().errorPrefix}${escapeHtml(err.message)}</div>`;
  } finally {
    sealBtn.disabled = false;
    sealBtn.classList.remove('spinning');
    statusText.textContent = '';
  }
}

// Generates (or loads a saved) whole-book overview — a different kind of
// note from a per-passage study, triggered when the input is a bare book
// name with no chapter or verse. Saved and looked up under the sentinel
// key from bookOverviewRefKey rather than a normal chapter:verse ref key,
// so it can never collide with a real study but still lives in the same
// studies/commentaryIndex system everything else already uses — which is
// what lets findBookOverview (used by Ask AI) find it with no extra
// storage mechanism.
async function generateBookOverview(bookIndex, forceRegenerate) {
  const errorSlot = document.getElementById('error-slot');
  const outputSlot = document.getElementById('output-slot');
  const sealBtn = document.getElementById('seal-btn');
  const statusText = document.getElementById('status-text');
  const m = bookMeta[bookIndex];
  const bookName = bookDisplayName(m);

  if (!forceRegenerate) {
    const existing = findBookOverview(bookIndex, currentLang);
    if (existing) {
      renderOutput(existing.text, { fromLibrary: true });
      return;
    }
  }

  const apiKey = getApiKey();
  if (!hasAIConnection()) { errorSlot.innerHTML = `<div class="error-box">${s().noKeyError}</div>`; return; }

  sealBtn.disabled = true;
  sealBtn.classList.add('spinning');
  statusText.textContent = s().generating;
  outputSlot.innerHTML = '';

  const systemPrompt = currentLang === 'es' ? BOOK_OVERVIEW_SYSTEM_PROMPT_ES : BOOK_OVERVIEW_SYSTEM_PROMPT_EN;

  try {
    let { text: resultText, stopReason } = await callAI(apiKey, bookName, systemPrompt, DEFAULT_CLOUD_MODEL, 2048, currentLang === 'es' ? 'overview_es' : 'overview_en');
    if (!resultText) throw new Error("Empty response");
    if (stopReason === 'max_tokens' || looksIncompleteOverview(resultText)) {
      statusText.textContent = s().retryingIncomplete || s().generating;
      const retry = await callAI(apiKey, bookName, systemPrompt, DEFAULT_CLOUD_MODEL, 4096, currentLang === 'es' ? 'overview_es' : 'overview_en');
      if (retry.text && (!looksIncompleteOverview(retry.text) || retry.text.length > resultText.length)) {
        resultText = retry.text;
      }
    }
    const stillIncomplete = looksIncompleteOverview(resultText);
    renderOutput(resultText);
    playChime('complete');
    if (stillIncomplete) {
      errorSlot.innerHTML = `<div class="error-box">${s().incompleteNoteWarning}</div>`;
    }
    const key = 'study_' + Date.now();
    saveStudy(key, { ref: `${bookName} — Overview`, text: resultText, lang: currentLang, savedAt: Date.now() });
    const keys = historyKeyList();
    keys.push(key);
    setHistoryKeyList(keys);
    const refKey = bookOverviewRefKey(bookIndex, currentLang);
    if (refKey) indexCommentaryEntry(refKey, key);
    refreshHistoryIfVisible();
  } catch (err) {
    errorSlot.innerHTML = `<div class="error-box">${s().errorPrefix}${escapeHtml(err.message)}</div>`;
  } finally {
    sealBtn.disabled = false;
    sealBtn.classList.remove('spinning');
    statusText.textContent = '';
  }
}

// Pulls the three ⟦LETTERS⟧ / ⟦INSIGHT⟧ / ⟦CAPTION⟧ marker lines (if present)
// out of a chunk of study text, leaving everything else untouched. Shared by
// the HTML renderer and the speech-text builder below so the two never drift.
function parsePictographBlock(chunk) {
  const lines = chunk.split('\n');
  let letters = null, insight = null, caption = null;
  const normalLines = [];
  for (const line of lines) {
    const t = line.trim();
    if (t.startsWith('⟦LETTERS⟧')) letters = t.slice('⟦LETTERS⟧'.length).trim();
    else if (t.startsWith('⟦INSIGHT⟧')) insight = t.slice('⟦INSIGHT⟧'.length).trim();
    else if (t.startsWith('⟦CAPTION⟧')) caption = t.slice('⟦CAPTION⟧'.length).trim();
    else normalLines.push(line);
  }
  return { normalText: normalLines.join('\n').trim(), letters, insight, caption };
}

// Renders one study chunk to HTML, expanding a pictograph block (if present)
// into the gold insight-reveal treatment instead of plain escaped text.
function renderChunkContent(chunk) {
  const { normalText, letters, insight, caption } = parsePictographBlock(chunk);
  const normalHtml = escapeHtml(normalText);
  if (!insight) return normalHtml;

  let lettersHtml = '';
  if (letters) {
    const items = letters.split(';').map(p => p.trim()).filter(Boolean).map(p => {
      const [sym, name, meaning] = p.split('|').map(x => (x || '').trim());
      return `<span class="insight-letter"><b>${escapeHtml(sym || '')}</b> ${escapeHtml(name || '')} — ${escapeHtml(meaning || '')}</span>`;
    }).join('');
    if (items) lettersHtml = `<div class="insight-letters">${items}</div><div class="insight-divider">${s().nowPutInOrder}</div>`;
  }
  const captionHtml = caption ? `<p class="insight-caption">${escapeHtml(caption)}</p>` : '';

  return `${normalHtml}
    <div class="insight-reveal">
      ${lettersHtml}
      <div class="insight-ring">
        <div class="insight-text">${escapeHtml(insight)}</div>
      </div>
      ${captionHtml}
    </div>`;
}

// Builds what should actually be spoken for a chunk — the raw marker syntax
// (⟦LETTERS⟧ ח|chet|a wall ; ...) is meant to be seen, not heard, so this
// turns it into plain narrated sentences instead of reading symbols aloud.
function chunkTextForSpeech(chunk) {
  const { normalText, letters, insight, caption } = parsePictographBlock(chunk);
  const parts = [];
  if (normalText) parts.push(normalText);
  if (letters) {
    const spoken = letters.split(';').map(p => p.trim()).filter(Boolean).map(p => {
      const [, name, meaning] = p.split('|').map(x => (x || '').trim());
      return `${name}, ${meaning}`;
    }).join('. ');
    if (spoken) parts.push(spoken + '.');
  }
  if (insight) parts.push(insight);
  if (caption) parts.push(caption);
  return parts.join('\n');
}

const WORDPLAY_LEGEND_SEEN_KEY = 'echochiasm_wordplay_legend_seen';

function renderOutput(text, options) {
  stopStudyReadAloud();
  const fromLibrary = options && options.fromLibrary;
  const outputSlot = document.getElementById('output-slot');
  const chunks = text.split(/\n\s*\n/).map(c => c.trim()).filter(c => c.length > 0);
  currentStudySpeechChunks = chunks.slice();
  const chunksHtml = chunks.map((chunk, i) => `<div class="study-chunk" data-chunk="${i}">${renderChunkContent(chunk)}</div>`).join('');
  const headerRef = chunks.length > 0 ? chunks[0].split('\n')[0] : '';

  const libraryBadge = fromLibrary
    ? `<div class="library-badge">${s().fromLibrary} <button id="regenerate-btn">${s().regenerateAnyway}</button></div>`
    : '';

  // One-time legend: only the first time a study actually contains a
  // Wordplay & Sound Echoes section does the reader see the Hebrew-vs-Greek
  // confidence distinction. Never repeated per verse after that. Keys off
  // the section header text itself (checked in both languages, since a
  // saved study's language doesn't always match the current UI language)
  // rather than an emoji, which used to double as a plain-string marker
  // but shouldn't be part of what gets displayed or read aloud.
  const hasWordplaySection = text.includes('Wordplay & Sound Echoes') || text.includes('Juegos de Palabras y Ecos Sonoros');
  const legendAlreadySeen = localStorage.getItem(WORDPLAY_LEGEND_SEEN_KEY) === '1';
  const showWordplayLegend = hasWordplaySection && !legendAlreadySeen;
  const wordplayLegendHtml = showWordplayLegend
    ? `<div class="wordplay-legend" id="wordplay-legend"><span>${escapeHtml(s().wordplayLegend)}</span><button id="wordplay-legend-dismiss">${s().dismiss}</button></div>`
    : '';
  if (showWordplayLegend) localStorage.setItem(WORDPLAY_LEGEND_SEEN_KEY, '1');

  outputSlot.innerHTML = `
    <div class="study-header">
      <span class="study-header-ref">${escapeHtml(headerRef)}</span>
      <button class="listen-btn" id="listen-study-btn"><svg class="icon-svg-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg><span>${s().listen}</span></button>
    </div>
    ${libraryBadge}
    ${wordplayLegendHtml}
    <div class="output-card">${chunksHtml}</div>
    <div class="output-actions">
      <button class="btn-secondary" id="copy-btn">${s().copy}</button>
      <button class="btn-secondary" id="share-btn"><svg class="icon-svg-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg> ${s().share}</button>
    </div>
  `;
  const wordplayDismissBtn = document.getElementById('wordplay-legend-dismiss');
  if (wordplayDismissBtn) {
    wordplayDismissBtn.onclick = () => {
      const el = document.getElementById('wordplay-legend');
      if (el) el.remove();
    };
  }
  document.getElementById('copy-btn').onclick = async () => {
    try {
      await navigator.clipboard.writeText(text);
      const btn = document.getElementById('copy-btn');
      btn.textContent = s().copied;
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = s().copy; btn.classList.remove('copied'); }, 1600);
    } catch (e) {}
  };
  document.getElementById('share-btn').onclick = async () => {
    const btn = document.getElementById('share-btn');
    if (navigator.share) {
      try {
        await navigator.share({ title: 'EchoChiasm — ' + headerRef, text: text });
      } catch (e) { /* user cancelled — no error needed */ }
    } else {
      try {
        await navigator.clipboard.writeText(text);
        const original = btn.innerHTML;
        btn.textContent = s().sharedFallback;
        setTimeout(() => { btn.innerHTML = original; }, 1800);
      } catch (e) {}
    }
  };
  document.getElementById('listen-study-btn').onclick = () => toggleStudyReadAloud(chunks);
  const regenBtn = document.getElementById('regenerate-btn');
  if (regenBtn) regenBtn.onclick = () => generateEchoChiasm(true);
  updateListenStudyBtnState();
}

function historyKeyList() {
  const raw = localStorage.getItem('echochiasm_history_index');
  return raw ? JSON.parse(raw) : [];
}
function setHistoryKeyList(keys) { localStorage.setItem('echochiasm_history_index', JSON.stringify(keys)); }

// ==================== STUDY STORAGE (IndexedDB) ====================
// Study bodies (verse/chapter notes, book overviews, Ask AI conversations)
// add up to several MB once every chapter in the Bible is mapped — past
// what localStorage can reliably hold, especially in mobile Safari. Bodies
// live in IndexedDB instead; echochiasm_history_index and
// echochiasm_commentary_index stay in localStorage since they're just
// small key lists/maps and cost nothing to keep there.
//
// studyCache mirrors IndexedDB in memory so every existing synchronous
// reader (findExistingStudy, findStudiesForChapter, gatherSyncPayload,
// etc.) keeps working unchanged — it's fully populated once at boot,
// before the UI can be interacted with, by initStudyCache().
const STUDY_DB_NAME = 'echochiasm_studies_db';
const STUDY_DB_STORE = 'studies';
const STUDY_DB_META_STORE = 'meta';
let studyCache = {};
let _studyDbPromise = null;

function openStudyDB() {
  if (_studyDbPromise) return _studyDbPromise;
  _studyDbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(STUDY_DB_NAME, STUDY_DB_SCHEMA_VERSION);
    req.onupgradeneeded = (event) => {
      const db = req.result;
      if (!db.objectStoreNames.contains(STUDY_DB_STORE)) {
        db.createObjectStore(STUDY_DB_STORE);
      }
      if (!db.objectStoreNames.contains(STUDY_DB_META_STORE)) {
        db.createObjectStore(STUDY_DB_META_STORE);
      }
      try {
        const tx = event.target.transaction;
        tx.objectStore(STUDY_DB_META_STORE).put({
          schemaVersion: STUDY_DB_SCHEMA_VERSION,
          upgradedAt: Date.now(),
          appVersion: ECHOCHIASM_APP_VERSION
        }, 'schema');
      } catch (_) {}
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return _studyDbPromise;
}

function idbGetAllStudies() {
  return openStudyDB().then(db => new Promise((resolve) => {
    const tx = db.transaction(STUDY_DB_STORE, 'readonly');
    const store = tx.objectStore(STUDY_DB_STORE);
    const out = {};
    const req = store.openCursor();
    req.onsuccess = (e) => {
      const cursor = e.target.result;
      if (cursor) { out[cursor.key] = cursor.value; cursor.continue(); }
      else resolve(out);
    };
    req.onerror = () => resolve(out); // best-effort: don't block boot on a read failure
  })).catch(() => ({}));
}

async function idbPutStudy(key, value) {
  try {
    const db = await openStudyDB();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(STUDY_DB_STORE, 'readwrite');
      tx.objectStore(STUDY_DB_STORE).put(value, key);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error || new Error('IndexedDB transaction failed'));
      tx.onabort = () => reject(tx.error || new Error('IndexedDB transaction aborted'));
    });
    return true;
  } catch (e) {
    console.error('IndexedDB study save failed', e);
    return false;
  }
}

async function idbDeleteStudy(key) {
  try {
    const db = await openStudyDB();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(STUDY_DB_STORE, 'readwrite');
      tx.objectStore(STUDY_DB_STORE).delete(key);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error || new Error('IndexedDB transaction failed'));
      tx.onabort = () => reject(tx.error || new Error('IndexedDB transaction aborted'));
    });
    return true;
  } catch (e) {
    console.error('IndexedDB study delete failed', e);
    return false;
  }
}

// One-time-per-load: loads every study into the in-memory cache, then
// pulls across any studies still sitting in localStorage from before this
// migration existed (or from an old Dropbox export merged before
// IndexedDB was wired up) and clears them out of localStorage afterward
// to reclaim its quota. Safe to call on every boot — already-migrated
// studies are skipped.
async function initStudyCache() {
  studyCache = await idbGetAllStudies();

  const keys = historyKeyList();
  let migrated = 0;
  for (const key of keys) {
    if (studyCache[key]) continue; // already in IndexedDB
    try {
      const raw = localStorage.getItem(key);
      if (!raw) continue;
      const parsed = JSON.parse(raw);
      studyCache[key] = parsed;
      const persisted = await idbPutStudy(key, parsed);
      // Never delete the old localStorage copy unless IndexedDB confirms
      // the write completed. This prevents migration-time data loss on
      // Safari storage failures, private browsing quirks, or quota errors.
      if (persisted) {
        localStorage.removeItem(key);
        migrated++;
      }
    } catch (e) {}
  }
  if (migrated) console.log(`Migrated ${migrated} studies from localStorage to IndexedDB`);
}

// Writes a study to the cache immediately (every synchronous reader sees
// it right away) and persists to IndexedDB in the background. The cache
// is the source of truth for the running session; IndexedDB just needs
// to catch up before the tab closes, which a `put` typically does well
// within the time it takes a person to read the result on screen.
function saveStudy(key, value) {
  studyCache[key] = value;

  // Short-lived crash-safe fallback: keep a localStorage copy until the
  // IndexedDB transaction has definitely committed. Normally this copy
  // exists only for milliseconds. If localStorage is already full, the
  // IndexedDB write can still succeed; if IndexedDB fails, the fallback
  // remains so the study survives a reload whenever localStorage allowed it.
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}

  idbPutStudy(key, value).then((persisted) => {
    if (persisted) {
      try { localStorage.removeItem(key); } catch (e) {}
    }
  });
}

function deleteStudy(key) {
  delete studyCache[key];
  try { localStorage.removeItem(key); } catch (e) {}
  idbDeleteStudy(key);
}

function getStudy(key) {
  return studyCache[key] || null;
}

async function saveToHistory(ref, text, lang) {
  try {
    const key = 'study_' + Date.now();
    saveStudy(key, { ref, text, lang, savedAt: Date.now() });
    const keys = historyKeyList();
    keys.push(key);
    setHistoryKeyList(keys);
    indexCommentaryEntry(normalizeRefKey(ref, lang), key);
    return key;
  } catch (e) { console.error('Save failed', e); return null; }
}

function loadHistory() {
  const listEl = document.getElementById('history-list');
  const keys = historyKeyList();
  if (keys.length === 0) { listEl.innerHTML = `<div class="empty-note">${s().noHistory}</div>`; return; }

  const items = keys.map(k => {
    const study = getStudy(k);
    return study ? { key: k, ...study } : null;
  }).filter(Boolean).filter(item => item.lang === currentLang);

  if (items.length === 0) { listEl.innerHTML = `<div class="empty-note">${s().noHistory}</div>`; return; }

  items.sort((a, b) => (b.savedAt || 0) - (a.savedAt || 0));

  listEl.innerHTML = items.map(item => `
    <div class="history-item" data-key="${encodeURIComponent(item.key)}">
      <span class="ref">${escapeHtml(item.ref || 'Untitled')}</span>
      <span class="del" data-del="${encodeURIComponent(item.key)}">✕</span>
    </div>
  `).join('');

  listEl.querySelectorAll('.history-item').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.dataset.del) return;
      const key = decodeURIComponent(el.dataset.key);
      const parsed = getStudy(key);
      if (parsed) {
        setLang(parsed.lang || 'en', true);
        switchView('study');
        renderOutput(parsed.text);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    });
  });

  listEl.querySelectorAll('.del').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!confirm(s().deleteConfirm)) return;
      const key = decodeURIComponent(el.dataset.del);
      deleteStudy(key);
      setHistoryKeyList(historyKeyList().filter(k => k !== key));
      loadHistory();
    });
  });
}

function refreshHistoryIfVisible() { if (historyVisible) loadHistory(); }

document.getElementById('history-toggle-btn').onclick = () => {

// ==================== v71 IDLE AUDIO CONTROLS ====================
// The top navigation stays fully opaque. The read/study transport fades after
// a short idle period and only direct interaction with that transport wakes it.
// This deliberately ignores window scroll events because read-aloud auto-scrolls
// on every verse; treating those scrolls as activity caused the v70 flashing bug.
const IdleChrome = {
  timer: null,
  delay: 2600,
  init() {
    const audio = document.getElementById('audio-bar');
    if (!audio) return;

    const wakeFromBar = () => this.wake();
    ['pointerdown','touchstart','click','keydown'].forEach(type =>
      audio.addEventListener(type, wakeFromBar, { passive: type !== 'keydown' })
    );

    // When a read/study session becomes visible, give the controls a moment
    // before dimming. Verse changes do not reset this timer.
    this.wake();
  },
  wake() {
    clearTimeout(this.timer);
    const audio = document.getElementById('audio-bar');
    if (!audio) return;
    audio.classList.remove('chrome-idle');
    this.timer = setTimeout(() => this.fade(), this.delay);
  },
  fade() {
    const audio = document.getElementById('audio-bar');
    if (!audio || !audio.classList.contains('show')) return;
    if (document.activeElement?.closest?.('.audio-bar')) {
      this.timer = setTimeout(() => this.fade(), 1000);
      return;
    }
    audio.classList.add('chrome-idle');
  }
};

if ('serviceWorker' in navigator) {

      window.EchoChiasmRuntime = Object.freeze({

        librarySchemaVersion: ECHOCHIASM_LIBRARY_SCHEMA_VERSION,
        studyDbSchemaVersion: STUDY_DB_SCHEMA_VERSION,
        serviceWorkerRegistration: registration
      });
    }).catch(() => {});
  });
}

// ==================== INIT ====================

function backfillCommentaryIndex() {
  // One-time-per-load pass so studies saved before this feature existed
  // (or from any session) get indexed too, not just newly generated ones.
  try {
    const keys = historyKeyList();
    const idx = getCommentaryIndex();
    let changed = false;
    keys.forEach(key => {
      const entry = getStudy(key);
      if (!entry) return;
      const refKey = normalizeRefKey(entry.ref, entry.lang);
      if (refKey && !idx[refKey]) {
        idx[refKey] = key;
        changed = true;
      }
    });
    if (changed) saveCommentaryIndex(idx);
  } catch (e) { console.error('Backfill failed', e); }
}

  setTheme(currentTheme);

  switchView('bible');
  await renderReadingView();
  if (cameFromDropboxSignIn) {
    initVoiceSettingsPanel();
    await updateSyncUI();
    openOverlay('settings-overlay');
  }
})();
