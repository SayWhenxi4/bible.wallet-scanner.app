// ==================== VOICE SEARCH (speech recognition) ====================

// Match the media app's driving/iOS wiring: do NOT disable Web Speech just
// because EchoChiasm is running as an installed iOS PWA. Current WebKit can
// expose SpeechRecognition there, but its audio route is more reliable when
// we explicitly prime microphone input first (especially with car Bluetooth /
// HFP). This is the same strategy used by the ASK AI media app.
const isIOSStandalonePWA = (() => {
  const isIOS = /iP(hone|od|ad)/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isStandalone = window.navigator.standalone === true ||
    window.matchMedia('(display-mode: standalone)').matches;
  return isIOS && isStandalone;
})();
const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognitionInstance = null;
let recognitionActive = false;
let micPrimeStream = null;

async function primeMicrophoneInput() {
  if (!navigator.mediaDevices?.getUserMedia) return false;
  try {
    if (!micPrimeStream) {
      micPrimeStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true,
        },
        video: false,
      });
    }
    return true;
  } catch (err) {
    console.warn('Microphone prime failed:', err);
    return false;
  }
}

function releaseMicrophoneInput() {
  if (!micPrimeStream) return;
  try { micPrimeStream.getTracks().forEach(t => t.stop()); } catch {}
  micPrimeStream = null;
}

function getRecognition() {
  if (!SpeechRecognitionCtor) return null;
  if (recognitionInstance) return recognitionInstance;

  // Created once and reused — a fresh instance every tap is what was causing
  // the repeated permission prompts.
  const recognition = new SpeechRecognitionCtor();
  recognition.continuous = false;   // stop automatically once a result comes in or the mic goes quiet
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  let gotResult = false;

  recognition.onstart = () => {
    gotResult = false;
    recognitionActive = true;
    const micBtn = document.getElementById('mic-btn');
    if (micBtn) micBtn.classList.add('listening');
  };
  recognition.onresult = (event) => {
    gotResult = true;
    const transcript = event.results[0][0].transcript;
    const input = document.getElementById('bible-search');
    input.value = transcript;
    runBibleSearch(transcript);
  };
  recognition.onerror = (event) => {
    // "aborted" fires as the normal byproduct of the user manually tapping
    // stop mid-recording — not a real error, so don't alarm them over it.
    // "no-speech" is handled by the friendlier message in onend below.
    if (event.error === 'aborted' || event.error === 'no-speech') return;

    const resultsEl = document.getElementById('search-results');
    if (resultsEl) {
      resultsEl.innerHTML = `<div class="error-box">${s().voiceErrorPrefix}${escapeHtml(event.error || 'unknown')}</div>`;
    }
  };
  recognition.onend = () => {
    recognitionActive = false;
    releaseMicrophoneInput();
    const micBtn = document.getElementById('mic-btn');
    if (micBtn) micBtn.classList.remove('listening');
    if (!gotResult) {
      const resultsEl = document.getElementById('search-results');
      if (resultsEl && resultsEl.innerHTML.trim() === '') {
        resultsEl.innerHTML = `<div class="empty-note">${s().voiceNoResult}</div>`;
      }
    }
  };

  recognitionInstance = recognition;
  return recognitionInstance;
}

async function toggleVoiceSearch() {
  const recognition = getRecognition();
  if (!recognition) return;

  if (recognitionActive) {
    recognition.stop(); // second tap while listening — stop immediately
    releaseMicrophoneInput();
    return;
  }

  recognition.lang = currentLang === 'es' ? 'es-ES' : 'en-US';
  // Prime the iPhone/car Bluetooth input route before Web Speech claims it.
  await primeMicrophoneInput();
  try {
    recognition.start();
  } catch (e) {
    // start() throws if already started/starting — safe to ignore
  }
}

// ==================== ASK AI ABOUT THIS PASSAGE (hands-free Q&A) ====================
// Mic -> speech-to-text -> short conversational answer from Claude (current
// chapter as context) -> spoken back via SpeechSynthesis.
//
// A FRESH SpeechRecognition instance is created for every single question,
// rather than reused (unlike the Bible-search recognizer above, which is
// deliberately cached). iOS Safari's WebKit implementation has a known bug
// where calling .start() again on a previously-used instance can silently
// hang — no onresult, no onerror, no onend, ever — which is what caused the
// "stuck on Listening..." bug. A short failsafe timeout below is a second,
// independent guard against the same failure mode.

let askAI = { active: false, phase: 'idle', turns: [] }; // phase: 'listening' | 'thinking' | 'speaking' | 'awaiting_continue'. turns: [{question, answer}, ...] for the current session — reset on a fresh startAskAI(), preserved across continueAskAI() follow-ups, saved as a library entry (if 2+ turns) whenever the session actually ends.
let currentAskRecognition = null;
let askListenTimeoutId = null;
let askWasReadAloudPlaying = false;
let askWasStudyReadAloudPlaying = false;
let askLastTeardownAt = 0; // timestamp of the last cancel/end, to guard against racing mic release
// The engine's own built-in silence cutoff (continuous=false) ends the
// question at the first natural pause, which feels rushed for a real
// question. continuous+interim below lets us track a longer, self-managed
// pause window instead, so someone can pause mid-question to think without
// the mic cutting them off.
const ASK_SILENCE_WINDOW_MS = 3200; // how long a pause is tolerated before treating the question as finished
const ASK_LISTEN_TIMEOUT_MS = 25000; // hard ceiling on total listening time regardless of pauses
const ASK_MIN_RESTART_GAP_MS = 400; // minimum gap iOS seems to need to fully release the mic before reclaiming it
const ASK_CONTINUE_WINDOW_MS = 60000; // how long a finished session waits for a follow-up tap before auto-finalizing (and saving, if it was a real back-and-forth)
let askContinueTimeoutId = null;

function clearAskListenTimeout() {
  if (askListenTimeoutId) { clearTimeout(askListenTimeoutId); askListenTimeoutId = null; }
}
function clearAskContinueTimeout() {
  if (askContinueTimeoutId) { clearTimeout(askContinueTimeoutId); askContinueTimeoutId = null; }
}

function toggleAskAI() {
  if (!askAI.active) { startAskAI(); return; }
  if (askAI.phase === 'awaiting_continue') { continueAskAI(); return; }
  cancelAskAI();
}

// ==================== HANDS-FREE BIBLE COMMANDS ====================
// These commands are handled locally before a transcript is sent to Claude.
// They therefore feel immediate while driving and do not spend API tokens.
function normalizeBibleVoiceCommand(text) {
  return String(text || '').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, ' ').trim();
}

function voiceNumberValue(raw) {
  const q = normalizeBibleVoiceCommand(raw);
  if (/^\d{1,3}$/.test(q)) return parseInt(q, 10);
  const ones = { one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,
    uno:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,trece:13,catorce:14,quince:15,dieciseis:16,diecisiete:17,dieciocho:18,diecinueve:19 };
  const tens = { twenty:20,thirty:30,forty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90,
    veinte:20,treinta:30,cuarenta:40,cincuenta:50,sesenta:60,setenta:70,ochenta:80,noventa:90 };
  if (ones[q]) return ones[q];
  const parts = q.split(' ').filter(x => x !== 'and' && x !== 'y');
  let total = 0;
  for (const part of parts) {
    if (part === 'one' && total === 100) { total += 1; continue; }
    if (part === 'hundred' || part === 'cien' || part === 'ciento') { total = Math.max(1,total) * 100; continue; }
    if (tens[part]) { total += tens[part]; continue; }
    if (ones[part]) { total += ones[part]; continue; }
    return null;
  }
  return total > 0 ? total : null;
}

function commandBookNameAliases(m) {
  const aliases = [m.en, m.es, m.abbr].filter(Boolean).map(normalizeBibleVoiceCommand);
  const en = normalizeBibleVoiceCommand(m.en);
  const es = normalizeBibleVoiceCommand(m.es);
  const ordinals = [
    ['1 ', ['first ', '1st ', 'primera ', 'primer ', 'uno ']],
    ['2 ', ['second ', '2nd ', 'segunda ', 'segundo ', 'dos ']],
    ['3 ', ['third ', '3rd ', 'tercera ', 'tercer ', 'tres ']]
  ];
  for (const [prefix, forms] of ordinals) {
    for (const base of [en, es]) {
      if (base.startsWith(prefix)) {
        const tail = base.slice(prefix.length);
        for (const f of forms) aliases.push(normalizeBibleVoiceCommand(f + tail));
      }
    }
  }
  return [...new Set(aliases)];
}

function isFastLocalBibleVoiceCommand(raw) {
  // v68: Commands that are complete/closed-form can execute as soon as
  // SpeechRecognition marks the phrase final instead of waiting for the
  // normal 3.2-second Ask-AI silence window. Open-ended SEARCH stays on the
  // normal timer so "Search tree" is not fired before "of life" is spoken.
  const q = normalizeBibleVoiceCommand(raw);
  if (!q || q.length > 120) return false;
  const exact = (...values) => values.some(v => q === v || q === `please ${v}` || q === `${v} please`);
  if (exact(
    'read', 'read bible', 'read chapter', 'read study', 'read notes', 'resume reading', 'continue reading', 'resume',
    'pause', 'pause reading', 'pause bible', 'pause study', 'pause notes', 'stop reading',
    'repeat', 'repeat chapter', 'repeat this chapter', 'repeat reading', 'repeat study', 'repeat notes',
    'undo repeat', 'turn off repeat', 'disable repeat', 'stop repeat', 'do not repeat', 'dont repeat',
    'backup to dropbox', 'back up to dropbox', 'backup dropbox', 'save to dropbox', 'save dropbox',
    'load from dropbox', 'load dropbox', 'restore from dropbox', 'restore dropbox'
  )) return true;
  if (/^(?:go to|goto|open)\s+(.+?)\s+(?:chapter\s+)?([a-z0-9 ]+)$/.test(q)) return true;
  if (/^(?:remove|clear|delete)\s+(?:the\s+)?highlight(?:\s+on)?\s+verse\s+([a-z0-9 -]+)$/.test(q)) return true;
  if (/^highlight\s+(?:verse|verses)\s+(.+?)(?:\s+(?:through|to|thru|-)\s+(.+))?$/.test(q)) return true;
  return false;
}

function finishBibleVoiceCommand() {
  // startAskAI() may have paused chapter reading so the microphone can hear
  // the driver. A local command owns the resulting state, so do not let the
  // normal Ask-AI teardown automatically resume the previous audio state.
  askWasReadAloudPlaying = false;
  askWasStudyReadAloudPlaying = false;
  finalizeAskSession();
  playChime('complete');
}

function executeBibleVoiceCommand(raw) {
  const q = normalizeBibleVoiceCommand(raw);
  if (!q || q.length > 120) return false;
  const exact = (...values) => values.some(v => q === v || q === `please ${v}` || q === `${v} please`);

  // READ — context-aware. In Bible view it reads the chapter; in Study
  // view it reads the generated notes. Either resumes from the paused spot.
  if (exact('read', 'read bible', 'read chapter', 'read study', 'read notes', 'resume reading', 'continue reading', 'resume')) {
    finishBibleVoiceCommand();
    if (currentView === 'study' && currentStudySpeechChunks.length) {
      if (studyReadAloud.active && studyReadAloud.paused) resumeStudyReadAloud();
      else if (!studyReadAloud.active) startStudyReadAloudFrom(currentStudySpeechChunks, 0);
    } else {
      if (readAloud.active && readAloud.paused) resumeReadAloud();
      else if (!readAloud.active) startReadAloudFrom(0);
    }
    return true;
  }

  // PAUSE — preserves the current position in whichever section is active.
  if (exact('pause', 'pause reading', 'pause bible', 'pause study', 'pause notes', 'stop reading')) {
    if (currentView === 'study' && studyReadAloud.active && !studyReadAloud.paused) pauseStudyReadAloud();
    else if (readAloud.active && !readAloud.paused) pauseReadAloud();
    finishBibleVoiceCommand();
    return true;
  }

  // REPEAT / UNDO REPEAT — voice equivalent of the repeat control in the
  // audio bar. In Bible view "repeat chapter" explicitly loops from verse 1
  // even if reading was originally started from a later verse.
  if (exact('repeat', 'repeat chapter', 'repeat this chapter', 'repeat reading', 'repeat study', 'repeat notes')) {
    audioRepeatEnabled = true;
    if (readAloud.active) readAloudStartVerseIndex = 0;
    updateAudioBar();
    finishBibleVoiceCommand();
    flashAskStatus(currentView === 'study' ? 'Repeat enabled for study notes.' : `Repeat enabled for ${bookDisplayName(bookMeta[currentBook])} ${currentChapter + 1}.`);
    return true;
  }

  if (exact('undo repeat', 'turn off repeat', 'disable repeat', 'stop repeat', 'do not repeat', 'dont repeat')) {
    audioRepeatEnabled = false;
    updateAudioBar();
    finishBibleVoiceCommand();
    flashAskStatus('Repeat turned off.');
    return true;
  }

  // GO TO <book> <chapter>, e.g. "Go to Genesis 14" or
  // "Go to First Corinthians thirteen".
  const gotoMatch = q.match(/^(?:go to|goto|open)\s+(.+?)\s+(?:chapter\s+)?([a-z0-9 ]+)$/);
  if (gotoMatch) {
    const bookSpoken = gotoMatch[1].trim();
    const chapter = voiceNumberValue(gotoMatch[2]);
    if (chapter) {
      finishBibleVoiceCommand();
      (async () => {
        try {
          await ensureBookMeta();
          await ensureBibleData(currentLang);
          const idx = bookMeta.findIndex(m => commandBookNameAliases(m).includes(bookSpoken));
          if (idx < 0) { flashAskStatus(`Book not found: ${gotoMatch[1]}`); return; }
          const maxChapters = bibleData[currentLang][idx].length;
          if (chapter < 1 || chapter > maxChapters) { flashAskStatus(`Chapter ${chapter} is not available in ${bookDisplayName(bookMeta[idx])}.`); return; }
          stopReadAloud();
          stopStudyReadAloud();
          currentBook = idx;
          currentChapter = chapter - 1;
          clearSelection();
          saveLastPosition();
          switchView('bible');
          await renderReadingView();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } catch (err) {
          flashAskStatus(s().loadErrorPrefix + (err?.message || err));
        }
      })();
      return true;
    }
  }

  // HIGHLIGHT VERSE <n> / HIGHLIGHT VERSES <n> THROUGH <m>.
  // Uses EchoChiasm's existing persistent highlight store, so a voice-created
  // highlight is exactly the same as one created by long-pressing a verse.
  // The default voice-command color is yellow; the person never has to choose
  // a color while driving. REMOVE HIGHLIGHT uses that same saved record.
  const removeHighlightMatch = q.match(/^(?:remove|clear|delete)\s+(?:the\s+)?highlight(?:\s+on)?\s+verse\s+([a-z0-9 -]+)$/);
  if (removeHighlightMatch) {
    const verse = voiceNumberValue(removeHighlightMatch[1]);
    if (verse) {
      const maxVerses = bibleData?.[currentLang]?.[currentBook]?.[currentChapter]?.length || 0;
      if (verse >= 1 && verse <= maxVerses) {
        removeHighlight(currentBook, currentChapter, verse - 1);
        if (currentView === 'bible') applyHighlightsToView();
        finishBibleVoiceCommand();
        flashAskStatus(`Highlight removed from ${bookDisplayName(bookMeta[currentBook])} ${currentChapter + 1}:${verse}.`);
        return true;
      }
    }
  }

  const highlightMatch = q.match(/^highlight\s+(?:verse|verses)\s+(.+?)(?:\s+(?:through|to|thru|-)\s+(.+))?$/);
  if (highlightMatch) {
    const first = voiceNumberValue(highlightMatch[1]);
    const last = highlightMatch[2] ? voiceNumberValue(highlightMatch[2]) : first;
    if (first && last) {
      const maxVerses = bibleData?.[currentLang]?.[currentBook]?.[currentChapter]?.length || 0;
      const lo = Math.min(first, last), hi = Math.max(first, last);
      if (lo >= 1 && hi <= maxVerses) {
        for (let verse = lo; verse <= hi; verse++) setHighlight(currentBook, currentChapter, verse - 1, 'yellow');
        if (currentView === 'bible') {
          applyHighlightsToView();
          const el = document.querySelector(`.verse-line[data-verse="${lo - 1}"]`);
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        finishBibleVoiceCommand();
        const ref = `${bookDisplayName(bookMeta[currentBook])} ${currentChapter + 1}:${lo}${hi !== lo ? '–' + hi : ''}`;
        flashAskStatus(`Highlighted ${ref}.`);
        return true;
      }
    }
  }

  // DROPBOX — hands-free equivalents of the existing Settings buttons.
  // These deliberately reuse saveToDropbox()/loadFromDropbox(), so there is
  // only one backup format and one merge policy in the app. The Dropbox
  // account must already have been connected once in Settings.
  if (exact('backup to dropbox', 'back up to dropbox', 'backup dropbox', 'save to dropbox', 'save dropbox')) {
    finishBibleVoiceCommand();
    (async () => {
      await saveToDropbox();
      const msg = document.getElementById('sync-status')?.textContent || 'Dropbox backup finished.';
      flashAskStatus(msg);
      if (document.getElementById('sync-status')?.classList.contains('ok')) playChime('complete');
    })();
    return true;
  }

  if (exact('load from dropbox', 'load dropbox', 'restore from dropbox', 'restore dropbox')) {
    finishBibleVoiceCommand();
    (async () => {
      await loadFromDropbox();
      const msg = document.getElementById('sync-status')?.textContent || 'Dropbox load finished.';
      flashAskStatus(msg);
      if (document.getElementById('sync-status')?.classList.contains('ok')) playChime('complete');
    })();
    return true;
  }

  // SEARCH <words>, e.g. "Search Tree of life". The normal Bible search
  // overlay and result renderer are reused, so voice and typed searches stay
  // perfectly consistent.
  const searchMatch = q.match(/^search(?: for)?\s+(.+)$/);
  if (searchMatch && searchMatch[1].trim().length >= 2) {
    const term = searchMatch[1].trim();
    finishBibleVoiceCommand();
    (async () => {
      document.getElementById('search-overlay-title').textContent = s().searchTitle;
      const input = document.getElementById('bible-search');
      input.placeholder = s().searchPlaceholder;
      input.value = term;
      document.getElementById('search-results').innerHTML = `<div class="empty-note">${escapeHtml(term)}</div>`;
      openOverlay('search-overlay');
      await runBibleSearch(term);
    })();
    return true;
  }

  return false;
}

function startAskAI() {
  if (!speechSupported) return; // TTS itself unsupported — nothing we can do
  const apiKey = getApiKey();
  if (!hasAIConnection()) { flashAskStatus(s().askNoKey); return; }
  if (!SpeechRecognitionCtor) { openAskTextInput(); return; }

  // Pause whatever's currently playing and remember to resume it once the
  // question has been answered — keeps the whole thing hands-free.
  askWasReadAloudPlaying = readAloud.active && !readAloud.paused;
  askWasStudyReadAloudPlaying = studyReadAloud.active && !studyReadAloud.paused;
  if (askWasReadAloudPlaying) pauseReadAloud();
  if (askWasStudyReadAloudPlaying) pauseStudyReadAloud();
  if (speechSupported) window.speechSynthesis.cancel();

  askAI = { active: true, phase: 'listening', turns: [] };
  syncAskAiBtnState();
  updateAudioBar();

  // Give iOS a moment to release the audio session from TTS before the mic
  // claims it — starting recognition in the same tick as cancel() was part
  // of what was causing it to hang without ever engaging. Also respect a
  // minimum gap since the last cancel/end of a prior ask session, since a
  // rapid retap can otherwise race the mic hardware still being released
  // from the previous attempt (a likely cause of it sometimes taking
  // several tries).
  const ttsDelay = (askWasReadAloudPlaying || askWasStudyReadAloudPlaying) ? 150 : 0;
  const sinceTeardown = Date.now() - askLastTeardownAt;
  const cooldownDelay = sinceTeardown < ASK_MIN_RESTART_GAP_MS ? (ASK_MIN_RESTART_GAP_MS - sinceTeardown) : 0;
  const delay = Math.max(ttsDelay, cooldownDelay);

  // When no delay is needed (the common case — nothing was playing, no
  // recent teardown to race), start recognition synchronously, right in the
  // tap handler's own call stack, rather than deferring even one tick —
  // iOS's user-activation window is generous, but there's no reason to
  // spend any of it if we don't have to.
  if (delay === 0) beginAskRecognition(); else setTimeout(beginAskRecognition, delay);
}

// Resumes listening for a follow-up within the SAME session — called when
// the person taps the button again while it's showing the "awaiting
// continue" state after an answer. Unlike startAskAI(), this does not
// reset askAI.turns or touch the read-aloud pause/resume bookkeeping,
// since nothing was playing during the awaiting-continue window and the
// conversation-so-far needs to survive into the next turn.
function continueAskAI() {
  if (!speechSupported) return;
  if (!SpeechRecognitionCtor) { clearAskContinueTimeout(); openAskTextInput(); return; }
  const apiKey = getApiKey();
  if (!hasAIConnection()) { flashAskStatus(s().askNoKey); return; }
  clearAskContinueTimeout();
  askAI.phase = 'listening';
  syncAskAiBtnState();
  updateAudioBar();
  const sinceTeardown = Date.now() - askLastTeardownAt;
  const delay = sinceTeardown < ASK_MIN_RESTART_GAP_MS ? (ASK_MIN_RESTART_GAP_MS - sinceTeardown) : 0;
  if (delay === 0) beginAskRecognition(); else setTimeout(beginAskRecognition, delay);
}

// How long a pause in the typed-question field is treated as "done" and
// auto-submitted — this is what lets dictation (which only fills the field
// via ordinary input events and never signals "the person is finished") get
// submitted hands-free, matching the mic flow's own silence-window
// behavior. Applies equally to manual typing, since there's no reliable way
// to tell dictated input apart from typed input from here — a somewhat
// generous window is used specifically so a manual typist pausing mid-
// thought isn't cut off before they're actually done.
const ASK_TEXT_AUTOSUBMIT_MS = 2200;
let askTextAutoSubmitTimeoutId = null;
function clearAskTextAutoSubmitTimeout() {
  if (askTextAutoSubmitTimeoutId) { clearTimeout(askTextAutoSubmitTimeoutId); askTextAutoSubmitTimeoutId = null; }
}

// Typed-question fallback for whenever speech recognition isn't usable
// (no SpeechRecognitionCtor — a browser/device where Web Speech is genuinely
// unavailable). Reuses the exact same downstream pipeline as voice: once
// submitted, the typed text goes straight into handleAskQuestion(), so the
// AI's answer, TTS playback, and "continue" flow are unchanged — only how
// the question gets in is different.
function openAskTextInput() {
  if (!askAI.active) {
    // Fresh session (called from startAskAI's branch) — same pause/cancel
    // bookkeeping the mic path does, so resuming afterward behaves the same.
    askWasReadAloudPlaying = readAloud.active && !readAloud.paused;
    askWasStudyReadAloudPlaying = studyReadAloud.active && !studyReadAloud.paused;
    if (askWasReadAloudPlaying) pauseReadAloud();
    if (askWasStudyReadAloudPlaying) pauseStudyReadAloud();
    if (speechSupported) window.speechSynthesis.cancel();
    askAI = { active: true, phase: 'listening', turns: [] };
  } else {
    // Follow-up within an existing session (called from continueAskAI's
    // branch) — turns already holds the prior back-and-forth, keep it.
    askAI.phase = 'listening';
  }
  syncAskAiBtnState();
  updateAudioBar();

  clearAskTextAutoSubmitTimeout();
  const input = document.getElementById('ask-ai-text-input');
  const errorEl = document.getElementById('ask-ai-text-error');
  if (errorEl) { errorEl.style.display = 'none'; errorEl.textContent = ''; }
  if (input) input.value = '';
  openOverlay('ask-ai-text-overlay');
  setTimeout(() => { if (input) input.focus(); }, 50); // after the sheet's open transition starts
}

function submitAskTextInput(auto) {
  clearAskTextAutoSubmitTimeout();
  const input = document.getElementById('ask-ai-text-input');
  const errorEl = document.getElementById('ask-ai-text-error');
  const text = input ? input.value.trim() : '';
  if (!text) {
    if (errorEl) { errorEl.textContent = s().askEnterQuestion; errorEl.style.display = 'block'; }
    return;
  }
  if (auto) playChime('submit'); // manual tap/Enter already gives its own tactile/visual feedback — the chime is specifically to confirm the hands-free path actually fired
  closeOverlay('ask-ai-text-overlay');
  handleAskQuestion(text);
}

document.getElementById('ask-ai-text-submit').onclick = () => submitAskTextInput(false);
document.getElementById('ask-ai-text-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); submitAskTextInput(false); }
});
document.getElementById('ask-ai-text-input').addEventListener('input', (e) => {
  clearAskTextAutoSubmitTimeout();
  if (!e.target.value.trim()) return; // nothing typed yet — don't arm the timer on an empty field
  askTextAutoSubmitTimeoutId = setTimeout(() => submitAskTextInput(true), ASK_TEXT_AUTOSUBMIT_MS);
});
document.getElementById('ask-ai-text-close').onclick = () => {
  clearAskTextAutoSubmitTimeout();
  closeOverlay('ask-ai-text-overlay');
  // Cancel outright on a fresh session (nothing asked yet); on a follow-up,
  // just leave the prior session as-is awaiting another tap.
  if (askAI.active && askAI.turns.length === 0) cancelAskAI();
};
document.getElementById('ask-ai-text-overlay').addEventListener('click', (e) => {
  if (e.target.id === 'ask-ai-text-overlay') document.getElementById('ask-ai-text-close').click();
});

async function beginAskRecognition() {
  if (!askAI.active || askAI.phase !== 'listening') return; // cancelled during the delay

  // Same car/iPhone fix as the media app: explicitly open the microphone
  // route first so WebKit can select the active Bluetooth/HFP input before
  // SpeechRecognition starts.
  await primeMicrophoneInput();
  if (!askAI.active || askAI.phase !== 'listening') return;

  const recognition = new SpeechRecognitionCtor();
  // continuous + interim results, plus our own silence-window timer below,
  // instead of the engine's own built-in cutoff (continuous=false), which
  // ends the question at the very first natural pause — too rushed for a
  // real, thought-out question.
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;
  recognition.lang = currentLang === 'es' ? 'es-ES' : 'en-US';

  let handled = false; // guards finalize() from running more than once
  let latestTranscript = '';
  let silenceTimeoutId = null;

  function finalize(transcript) {
    if (handled) return;
    handled = true;
    clearAskListenTimeout();
    if (silenceTimeoutId) clearTimeout(silenceTimeoutId);
    if (transcript && transcript.trim()) {
      if (!executeBibleVoiceCommand(transcript)) handleAskQuestion(transcript);
    } else endAskAI(s().askNoSpeech);
  }

  // Restarted on every result (interim or final) — so as long as the person
  // keeps speaking, even with pauses to think, the window keeps sliding
  // forward. Only a true ASK_SILENCE_WINDOW_MS of silence ends it.
  function resetSilenceTimer() {
    if (silenceTimeoutId) clearTimeout(silenceTimeoutId);
    silenceTimeoutId = setTimeout(() => {
      try { recognition.stop(); } catch (e) {}
      finalize(latestTranscript);
    }, ASK_SILENCE_WINDOW_MS);
  }

  recognition.onstart = () => { playAskChime('engage'); resetSilenceTimer(); };
  recognition.onresult = (event) => {
    let transcript = '';
    for (let i = 0; i < event.results.length; i++) transcript += event.results[i][0].transcript;
    latestTranscript = transcript;

    // v68 speed path: once iOS marks a closed-form local command as final,
    // execute it immediately. Normal Ask-AI questions and open-ended Search
    // phrases retain the generous silence window so natural thinking pauses
    // are not cut off.
    const lastResult = event.results[event.results.length - 1];
    if (lastResult && lastResult.isFinal && isFastLocalBibleVoiceCommand(latestTranscript)) {
      try { recognition.stop(); } catch (e) {}
      finalize(latestTranscript);
      return;
    }
    resetSilenceTimer();
  };
  recognition.onerror = (event) => {
    if (event.error === 'aborted') { handled = true; if (silenceTimeoutId) clearTimeout(silenceTimeoutId); return; } // cancelAskAI() already tore things down
    if (event.error === 'no-speech' && !latestTranscript.trim()) { finalize(''); return; }
    finalize(latestTranscript); // salvage whatever was captured before the error
  };
  recognition.onend = () => { finalize(latestTranscript); };

  currentAskRecognition = recognition;
  try {
    recognition.start();
  } catch (e) {
    clearAskListenTimeout();
    endAskAI(s().askErrorPrefix + (e && e.message ? e.message : 'start failed'));
    return;
  }

  // Hard ceiling on total listening time regardless of pauses — guarantees
  // the UI can never get stuck on "Listening..." indefinitely, and stops a
  // very long ramble from running forever.
  askListenTimeoutId = setTimeout(() => {
    try { recognition.stop(); } catch (e2) {}
    finalize(latestTranscript);
  }, ASK_LISTEN_TIMEOUT_MS);
}

function cancelAskAI() {
  clearAskListenTimeout();
  if (currentAskRecognition && askAI.phase === 'listening') {
    try { currentAskRecognition.abort(); } catch (e) {}
  }
  if (speechSupported) window.speechSynthesis.cancel();
  finalizeAskSession();
}

function endAskAI(errorMessage) {
  clearAskListenTimeout();
  finalizeAskSession();
  if (errorMessage) flashAskStatus(errorMessage);
}

// The single place a session actually ends, from any path: manual cancel,
// an error, the continue-window timing out with no follow-up tap, or the
// person navigating to a different chapter mid-conversation. If the
// session was a real back-and-forth (2+ turns) it gets saved as a library
// entry before the state resets — a single quick question is NOT saved,
// so Ask AI doesn't clutter the library with every one-off lookup, only
// the conversations substantial enough to be worth having Ask AI draw on
// again later.
function finalizeAskSession() {
  clearAskContinueTimeout();
  releaseMicrophoneInput();
  if (askAI.turns && askAI.turns.length >= 2) saveAskConversation(askAI.turns);
  const wasActive = askAI.active;
  askAI = { active: false, phase: 'idle', turns: [] };
  askLastTeardownAt = Date.now();
  syncAskAiBtnState();
  updateAudioBar();
  if (wasActive) playAskChime('disengage');
  maybeResumeAfterAsk();
}

// Saves a multi-turn Ask AI conversation the same way a generated study
// is saved — same studies/commentaryIndex system, so findStudiesForChapter
// picks it up naturally in future Ask AI sessions on this chapter. Indexed
// with a "conversation-<timestamp>" suffix rather than a verse range, so
// it can never collide with (and silently overwrite the index pointer to)
// an existing generated chapter note for the same chapter.
function saveAskConversation(turns) {
  if (!bookMeta || !bookMeta[currentBook]) return;
  const m = bookMeta[currentBook];
  const bookNameLower = (currentLang === 'es' ? m.es : m.en).toLowerCase();
  const chapterRef = `${bookDisplayName(m)} ${currentChapter + 1}`;
  const refLabel = `${chapterRef} — Ask AI Conversation`;
  const body = turns.map(t => `Q: ${t.question}\nA: ${t.answer}`).join('\n\n');
  const text = `${refLabel}\n\n${body}\n`;
  const key = 'study_' + Date.now();
  saveStudy(key, { ref: refLabel, text, lang: currentLang, savedAt: Date.now() });
  const keys = historyKeyList();
  keys.push(key);
  setHistoryKeyList(keys);
  const refKey = `${currentLang}:${bookNameLower} ${currentChapter + 1}:conversation-${Date.now()}`;
  indexCommentaryEntry(refKey, key);
  refreshHistoryIfVisible();
}

// Shows a message in the audio bar for a few seconds even when nothing is
// otherwise active (e.g. missing API key, recognition error), then lets the
// bar fall back to its normal hidden/active state.
function flashAskStatus(message) {
  const bar = document.getElementById('audio-bar');
  bar.classList.add('show');
  document.getElementById('audio-playpause-btn').style.display = 'none';
  document.getElementById('audio-repeat-btn').style.display = 'none';
  document.getElementById('audio-stop-btn').style.display = 'none';
  document.getElementById('audio-status').textContent = message;
  setTimeout(() => {
    if (!readAloud.active && !studyReadAloud.active && !askAI.active) updateAudioBar();
  }, 3200);
}

// Small chimes marking distinct events — no external audio file, generated
// on the fly with the Web Audio API so it works offline. 'engage' rises in
// pitch and 'disengage' falls, the mic start/stop cue Ask AI already used.
// 'complete' is a new two-note ascending chime for study/overview
// generation finishing — deliberately a different shape (two clear notes,
// not a single sweep) so it reads as "your note is ready" rather than
// echoing the mic cue for an unrelated event.
let askAudioCtx = null;
function getAskAudioCtx() {
  const Ctor = window.AudioContext || window.webkitAudioContext;
  if (!Ctor) return null;
  if (!askAudioCtx) askAudioCtx = new Ctor();
  if (askAudioCtx.state === 'suspended') askAudioCtx.resume();
  return askAudioCtx;
}
function playChime(kind) {
  const ctx = getAskAudioCtx();
  if (!ctx) return;
  const now = ctx.currentTime;
  if (kind === 'complete') {    // Two short notes, a rising fifth (e.g. 587Hz -> 880Hz) — a familiar
    // "done" shape, distinct from the single-sweep mic engage/disengage
    // tones so the two events don't sound alike. Peak gain raised to 0.4
    // (from 0.22) specifically for this chime — it needed to read clearly
    // over whatever the person might be doing elsewhere on the device
    // while a note finishes generating in the background, unlike the mic
    // engage/disengage cues, which happen while already looking at the
    // screen and didn't need the same boost.
    [ [587, now, 0.09], [880, now + 0.1, 0.16] ].forEach(([freq, start, dur]) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, start);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.4, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
      osc.start(start);
      osc.stop(start + dur + 0.02);
    });
    return;
  }
  if (kind === 'submit') {
    // A single quick, light blip — signals "your typed question was just
    // sent" specifically for auto-submit (after a pause in typing/dictation
    // with no manual tap), so it's audibly distinct from the mic-open/close
    // sweeps (engage/disengage) and the two-note "note finished" chime
    // (complete). Higher and shorter than either, since it's confirming a
    // quiet background event rather than a state the person is watching for.
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, now);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.3, now + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.11);
    osc.start(now);
    osc.stop(now + 0.13);
    return;
  }
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.type = 'sine';
  if (kind === 'engage') {
    osc.frequency.setValueAtTime(520, now);
    osc.frequency.linearRampToValueAtTime(780, now + 0.12);
  } else {
    osc.frequency.setValueAtTime(780, now);
    osc.frequency.linearRampToValueAtTime(420, now + 0.14);
  }
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(0.22, now + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.16);
  osc.start(now);
  osc.stop(now + 0.18);
}
function playAskChime(kind) { playChime(kind); } // kept as a thin alias — existing Ask AI call sites are unchanged

function maybeResumeAfterAsk() {
  if (askWasReadAloudPlaying) { askWasReadAloudPlaying = false; resumeReadAloud(); }
  else if (askWasStudyReadAloudPlaying) { askWasStudyReadAloudPlaying = false; resumeStudyReadAloud(); }
}

async function handleAskQuestion(transcript) {
  if (!transcript || !transcript.trim()) { endAskAI(s().askNoSpeech); return; }
  const question = transcript.trim();

  askAI.phase = 'thinking';
  syncAskAiBtnState();
  updateAudioBar();

  const apiKey = getApiKey();
  const m = bookMeta[currentBook];
  const chapterRef = `${bookDisplayName(m)} ${currentChapter + 1}`;
  const systemPrompt = currentLang === 'es' ? ASK_SYSTEM_PROMPT_ES : ASK_SYSTEM_PROMPT_EN;

  // The full context block (passage, prior studies, book overview, related
  // echoes) only needs building once per session — it's the content of the
  // very first user message. Every follow-up after that is just its own
  // raw question, sent alongside the real conversation history built from
  // askAI.turns, so the model sees actual prior turns rather than the same
  // giant context block repeated (and paid for) on every single question.
  function buildFirstMessageContent(firstQuestion) {
    const verses = bibleData[currentLang][currentBook][currentChapter];
    const chapterText = verses.map((v, i) => `${i + 1}. ${v}`).join(' ');
    const priorStudies = findStudiesForChapter(currentBook, currentChapter, currentLang);
    const studiesContext = priorStudies.length
      ? `\n\nPreviously generated EchoChiasm study notes for this passage (background only — draw on this analysis so your answer is consistent with what the app has already surfaced, but never read it back verbatim, never list its section headers, and never mention that notes exist):\n${priorStudies.join('\n\n---\n\n')}`
      : '';
    const overview = findBookOverview(currentBook, currentLang);
    const overviewContext = overview
      ? `\n\nWhole-book overview for ${bookDisplayName(m)} (background only — use this to place the current passage in the book's larger shape if relevant, but never read it back verbatim or mention it exists):\n${overview.text}`
      : '';
    const relatedStudies = findRelatedByEchoes(currentBook, currentChapter, currentLang, priorStudies);
    const relatedContext = relatedStudies.length
      ? `\n\nStudy notes for OTHER passages this one echoes or is echoed by (background only — use these to follow a real cross-reference thread if the question calls for it, but never read them back verbatim or mention that notes exist for them):\n${relatedStudies.join('\n\n---\n\n')}`
      : '';
    return `Passage — ${chapterRef}:\n${chapterText}${studiesContext}${overviewContext}${relatedContext}\n\nQuestion: ${firstQuestion}`;
  }

  const messages = [];
  if (askAI.turns.length === 0) {
    messages.push({ role: 'user', content: buildFirstMessageContent(question) });
  } else {
    messages.push({ role: 'user', content: buildFirstMessageContent(askAI.turns[0].question) });
    messages.push({ role: 'assistant', content: askAI.turns[0].answer });
    for (let i = 1; i < askAI.turns.length; i++) {
      messages.push({ role: 'user', content: askAI.turns[i].question });
      messages.push({ role: 'assistant', content: askAI.turns[i].answer });
    }
    messages.push({ role: 'user', content: question });
  }

  try {
    // Sonnet 5 rather than Haiku — deep word-study/theological questions
    // need real reasoning quality, and at $2/$10 per MTok the cost
    // difference is still a fraction of a cent per question. A multi-turn
    // conversation re-sends the full first-message context on every call
    // (Anthropic's API is stateless between requests), so a longer
    // back-and-forth costs more than a single question — worth knowing,
    // though still small in absolute terms for how this feature is used.
    //
    // 1200, not 700 — the system prompt explicitly invites longer answers
    // for genuinely deep questions ("take the room a real, unhurried
    // answer needs"), and 700 tokens (roughly 500 words) was too tight a
    // ceiling to honor that instruction, especially on later turns in a
    // long conversation where questions tend to get more developed. This
    // was silently cutting spoken answers off mid-sentence with no way to
    // tell it had happened. Same fix pattern as note generation: check
    // stop_reason, and retry once at a higher ceiling if it was cut short.
    let { text: answer, stopReason } = await callAI(apiKey, messages, systemPrompt, DEFAULT_CLOUD_MODEL, 1200, currentLang === 'es' ? 'ask_es' : 'ask_en');
    if (!answer) throw new Error('Empty response');
    if (stopReason === 'max_tokens' || looksIncompleteAnswer(answer)) {
      const retry = await callAI(apiKey, messages, systemPrompt, DEFAULT_CLOUD_MODEL, 2200, currentLang === 'es' ? 'ask_es' : 'ask_en');
      if (retry.text && (!looksIncompleteAnswer(retry.text) || retry.text.length > answer.length)) {
        answer = retry.text;
      }
    }
    askAI.turns.push({ question, answer });
    speakAskAnswer(answer);
  } catch (err) {
    endAskAI(s().askErrorPrefix + err.message);
  }
}

function speakAskAnswer(text) {
  if (!askAI.active) return;
  askAI.phase = 'speaking';
  syncAskAiBtnState();
  updateAudioBar();

  speechToken++; // shares the invalidation token with the read-aloud engines
  const myToken = speechToken;
  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = currentLang === 'es' ? 'es-ES' : 'en-US';
  applyVoiceAndRate(utterance, currentLang);
  utterance.onend = () => { if (myToken === speechToken) finishAskTurn(); };
  utterance.onerror = () => { if (myToken === speechToken) finishAskTurn(); };
  window.speechSynthesis.speak(utterance);
}

// Called when an answer finishes speaking — instead of ending the session
// outright, opens a window where tapping the button again resumes
// listening for a follow-up with the conversation so far intact (see
// continueAskAI). If nothing happens within ASK_CONTINUE_WINDOW_MS, the
// session finalizes on its own via the same path a manual end would take,
// saving it first if it was a real back-and-forth.
function finishAskTurn() {
  if (!askAI.active) return;
  askAI.phase = 'awaiting_continue';
  syncAskAiBtnState();
  updateAudioBar();
  clearAskContinueTimeout();
  askContinueTimeoutId = setTimeout(() => { finalizeAskSession(); }, ASK_CONTINUE_WINDOW_MS);
}

// Large hands-free microphone controller. This is only a remote control for
// EchoChiasm's existing toggleAskAI() flow; it does not replace or alter the
// proven speech-recognition / Claude / TTS logic above.
const FloatingAskAIMic = {
  el: null,
  idleTimer: null,
  pointers: new Map(),
  dragStart: null,
  pinchStart: null,
  size: 190,

  init() {
    this.el = document.getElementById('floating-ask-ai-mic');
    if (!this.el) return;
    const saved = this.loadGeometry();
    this.size = saved.size;
    this.applyGeometry(saved.x, saved.y, saved.size);
    this.el.style.touchAction = 'none';

    this.el.addEventListener('pointerdown', e => this.pointerDown(e), { passive: false });
    this.el.addEventListener('pointermove', e => this.pointerMove(e), { passive: false });
    this.el.addEventListener('pointerup', e => this.pointerUp(e), { passive: false });
    this.el.addEventListener('pointercancel', e => this.pointerUp(e), { passive: false });
    ['gesturestart','gesturechange','gestureend','touchstart','touchmove','touchend'].forEach(type => {
      this.el.addEventListener(type, e => e.preventDefault(), { passive: false });
    });
    this.el.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); this.tap(); }
    });
    window.addEventListener('resize', () => {
      const g = this.currentGeometry();
      const clamped = this.clamp(g.x, g.y, g.size);
      this.applyGeometry(clamped.x, clamped.y, g.size);
      this.saveGeometry(clamped.x, clamped.y, g.size);
    });
    this.syncVisibility();
    this.syncState();
  },

  loadGeometry() {
    const fallback = { x: Math.max(12, window.innerWidth - 202), y: 102, size: 190 };
    try {
      const raw = localStorage.getItem('echochiasm-floating-ask-mic-geometry');
      if (!raw) return fallback;
      const g = JSON.parse(raw);
      const size = Math.min(330, Math.max(120, Number(g.size) || fallback.size));
      const x = Math.min(Math.max(4, Number(g.x) || fallback.x), Math.max(4, window.innerWidth - size - 4));
      const y = Math.min(Math.max(4, Number(g.y) || fallback.y), Math.max(4, window.innerHeight - size - 4));
      return { x, y, size };
    } catch { return fallback; }
  },

  saveGeometry(x, y, size) {
    try { localStorage.setItem('echochiasm-floating-ask-mic-geometry', JSON.stringify({ x, y, size })); } catch {}
  },

  applyGeometry(x, y, size) {
    if (!this.el) return;
    this.size = size;
    this.el.style.left = `${x}px`;
    this.el.style.top = `${y}px`;
    this.el.style.right = 'auto';
    this.el.style.width = `${size}px`;
    this.el.style.height = `${size}px`;
  },

  currentGeometry() {
    return {
      x: parseFloat(this.el?.style.left) || 0,
      y: parseFloat(this.el?.style.top) || 0,
      size: this.size || this.el?.getBoundingClientRect().width || 190
    };
  },

  clamp(x, y, size = this.size) {
    return {
      x: Math.min(Math.max(4, x), Math.max(4, window.innerWidth - size - 4)),
      y: Math.min(Math.max(4, y), Math.max(4, window.innerHeight - size - 4))
    };
  },

  pointerDown(e) {
    e.preventDefault(); e.stopPropagation();
    try { this.el.setPointerCapture(e.pointerId); } catch {}
    this.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (this.pointers.size === 1) {
      const g = this.currentGeometry();
      this.dragStart = { pointerId:e.pointerId, startX:e.clientX, startY:e.clientY, originX:g.x, originY:g.y, moved:false, time:performance.now() };
      this.pinchStart = null;
    } else if (this.pointers.size === 2) {
      this.dragStart = null;
      const pts = [...this.pointers.values()];
      const g = this.currentGeometry();
      this.pinchStart = { distance: Math.max(1, Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y)), size:g.size, x:g.x, y:g.y };
    }
    this.markActive();
  },

  pointerMove(e) {
    if (!this.pointers.has(e.pointerId)) return;
    e.preventDefault(); e.stopPropagation();
    this.pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if (this.pointers.size === 2 && this.pinchStart) {
      const pts = [...this.pointers.values()];
      const distance = Math.max(1, Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y));
      const newSize = Math.min(330, Math.max(120, this.pinchStart.size * distance / this.pinchStart.distance));
      const centerX = (pts[0].x + pts[1].x) / 2;
      const centerY = (pts[0].y + pts[1].y) / 2;
      let x = centerX - newSize / 2;
      let y = centerY - newSize / 2;
      ({x,y} = this.clamp(x,y,newSize));
      this.applyGeometry(x,y,newSize);
      this.saveGeometry(x,y,newSize);
      return;
    }
    if (this.pointers.size === 1 && this.dragStart) {
      const dx = e.clientX - this.dragStart.startX;
      const dy = e.clientY - this.dragStart.startY;
      if (Math.hypot(dx,dy) > 7) this.dragStart.moved = true;
      if (this.dragStart.moved) {
        let {x,y} = this.clamp(this.dragStart.originX + dx, this.dragStart.originY + dy);
        this.applyGeometry(x,y,this.size);
        this.saveGeometry(x,y,this.size);
      }
    }
  },

  pointerUp(e) {
    e.preventDefault(); e.stopPropagation();
    const wasTap = this.pointers.size === 1 && this.dragStart && !this.dragStart.moved && (performance.now() - this.dragStart.time) < 450;
    this.pointers.delete(e.pointerId);
    try { this.el.releasePointerCapture(e.pointerId); } catch {}
    if (this.pointers.size === 0) {
      const g = this.currentGeometry();
      this.saveGeometry(g.x,g.y,g.size);
      this.dragStart = null; this.pinchStart = null;
      if (wasTap) this.tap();
    } else if (this.pointers.size === 1) {
      this.dragStart = null;
    }
  },

  tap() {
    this.markActive();
    toggleAskAI();
  },

  syncState() {
    if (!this.el) return;
    this.el.classList.toggle('listening', askAI.active && askAI.phase === 'listening');
    this.el.classList.toggle('thinking', askAI.active && askAI.phase === 'thinking');
    this.el.classList.toggle('speaking', askAI.active && askAI.phase === 'speaking');
    this.el.classList.toggle('awaiting', askAI.active && askAI.phase === 'awaiting_continue');
    if (askAI.active) this.markActive();
  },

  syncVisibility() {
    if (!this.el) return;
    const shouldShow = (currentView === 'bible' || currentView === 'study') && speechSupported;
    this.el.style.display = shouldShow ? 'flex' : 'none';
    if (shouldShow) this.markActive();
  },

  markActive() {
    if (!this.el) return;
    this.el.classList.remove('fam-idle');
    clearTimeout(this.idleTimer);
    this.idleTimer = setTimeout(() => {
      if (!askAI.active) this.el.classList.add('fam-idle');
    }, 3000);
  }
};

function syncAskAiBtnState() {
  const btn = document.getElementById('ask-ai-btn');
  if (btn) {
    btn.classList.toggle('listening', askAI.active && askAI.phase === 'listening');
    btn.classList.toggle('thinking', askAI.active && askAI.phase === 'thinking');
    btn.classList.toggle('speaking', askAI.active && askAI.phase === 'speaking');
    btn.classList.toggle('awaiting', askAI.active && askAI.phase === 'awaiting_continue');
  }
  FloatingAskAIMic.syncState();
}

// ==================== BOOK / CHAPTER PICKER (combined dropdown) ====================

let pendingBook = null; // book highlighted while picker is open, before chapter is confirmed

function renderChapterSection(bookIndex) {
  const data = bibleData[currentLang];
  const chapterCount = data[bookIndex].length;
  const m = bookMeta[bookIndex];
  document.getElementById('picker-chapter-label').textContent = `${s().chapterTitle} — ${bookDisplayName(m)}`;

  let html = '';
  for (let c = 0; c < chapterCount; c++) {
    const isCurrent = bookIndex === currentBook && c === currentChapter;
    html += `<div class="chapter-tile${isCurrent ? ' current' : ''}" data-chapter="${c}">${c + 1}</div>`;
  }
  document.getElementById('chapter-overlay-content').innerHTML = html;

  document.querySelectorAll('#chapter-overlay-content .chapter-tile').forEach(el => {
    el.addEventListener('click', async () => {
      stopReadAloud();
      currentBook = pendingBook;
      currentChapter = parseInt(el.dataset.chapter, 10);
      clearSelection();
      saveLastPosition();
      closeOverlay('book-overlay');
      await renderReadingView();
    });
  });
}

function renderBookSection() {
  document.getElementById('book-overlay-title').textContent = s().booksTitle;
  const otBooks = bookMeta.slice(0, OT_COUNT);
  const ntBooks = bookMeta.slice(OT_COUNT);

  const renderGroup = (label, books) => `
    <div class="book-group-label">${label}</div>
    <div class="book-grid">
      ${books.map(m => `<div class="book-tile${m.i === pendingBook ? ' current' : ''}" data-book="${m.i}">${escapeHtml(bookDisplayName(m))}</div>`).join('')}

async function runBibleSearch(query) {
  const resultsEl = document.getElementById('search-results');
  if (query.length < 3) {
    resultsEl.innerHTML = `<div class="empty-note">${s().searchHint}</div>`;
    return;
  }
  let data;
  try {
    await ensureBookMeta();
    data = await ensureBibleData(currentLang);
  } catch (err) {
    resultsEl.innerHTML = `<div class="error-box">${s().loadErrorPrefix}${escapeHtml(err.message)}</div>`;
    return;
  }
  const qLower = query.toLowerCase();
  const results = [];

  for (let bIdx = 0; bIdx < data.length && results.length < 60; bIdx++) {
    const book = data[bIdx];
    for (let cIdx = 0; cIdx < book.length && results.length < 60; cIdx++) {
      const chapter = book[cIdx];
      for (let vIdx = 0; vIdx < chapter.length && results.length < 60; vIdx++) {
        const text = chapter[vIdx];
        if (text.toLowerCase().includes(qLower)) {
          results.push({ bookIndex: bIdx, chapterIndex: cIdx, verseIndex: vIdx, text });
        }
      }
    }
  }

  if (results.length === 0) {
    resultsEl.innerHTML = `<div class="empty-note">${s().noResults}</div>`;
    return;
  }

  resultsEl.innerHTML = results.map(r => {
    const m = bookMeta[r.bookIndex];
    const ref = `${bookDisplayName(m)} ${r.chapterIndex + 1}:${r.verseIndex + 1}`;
    return `<div class="search-result-row" data-book="${r.bookIndex}" data-chapter="${r.chapterIndex}" data-verse="${r.verseIndex}">
      <div class="search-result-ref">${escapeHtml(ref)}</div>
      <div class="search-result-snippet">${escapeHtml(r.text)}</div>
    </div>`;
  }).join('');

  document.querySelectorAll('.search-result-row').forEach(el => {
    el.addEventListener('click', async () => {
      stopReadAloud();
      currentBook = parseInt(el.dataset.book, 10);
      currentChapter = parseInt(el.dataset.chapter, 10);
      const targetVerse = parseInt(el.dataset.verse, 10);
      clearSelection();
      saveLastPosition();
      closeOverlay('search-overlay');
      await renderReadingView();
      const verseEl = document.querySelector(`.verse-line[data-verse="${targetVerse}"]`);
      if (verseEl) {
        toggleVerseSelection(targetVerse, verseEl);
        verseEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    });
  });
}

async function callAI(apiKey, userText, systemPrompt, model, maxTokens, task) {
  const messages = Array.isArray(userText) ? userText : [{ role: "user", content: userText }];
  const request = {
    apiVersion: ECHOCHIASM_AI_CAPABILITY_VERSION,
    task: task || 'ask_en',
    messages,
    systemPrompt: systemPrompt || '',
    modelHint: model || DEFAULT_CLOUD_MODEL,
    maxTokens: maxTokens || 1500,
    lang: currentLang
  };

  // Optional on-device/native adapter. It is deliberately opt-in so v81
  // behaves exactly like v80 in today's browsers.
  const local = prefersLocalAI() ? localAIAdapter() : null;
  if (local) {
    try {
      const result = await local.request(request);
      if (result && typeof result.text === 'string' && result.text.trim()) {
        return {
          text: result.text.trim(),
          stopReason: result.stopReason || null,
          diagnostic: { ...(result.diagnostic || {}), provider: 'on-device' }
        };
      }
      throw new Error('Local AI returned an empty response.');
    } catch (err) {
      console.warn('EchoChiasm local AI unavailable; falling back to configured cloud route.', err);
    }
  }

  // Default path: EchoChiasm's server-side AI gateway.
  if (getAiMode() === 'shared') {
    const response = await fetch(ECHO_RELAY_ENDPOINT, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Echo-Client': getEchoClientId(),
        'X-Echo-App-Token': ECHO_APP_TOKEN
      },
      body: JSON.stringify({
        apiVersion: ECHOCHIASM_AI_CAPABILITY_VERSION,
        task: request.task,
        messages,
        maxTokens: request.maxTokens
      })
    });
    if (!response.ok) {
      const errBody = await response.text().catch(() => '');
      let msg = 'EchoChiasm AI request failed (' + response.status + ')';
      try {
        const parsed = JSON.parse(errBody);
        if (parsed.error) msg = parsed.error;
        if (request.task === 'health' && parsed.diagnostic) {
          const d = parsed.diagnostic;
          const parts = [];
          if (d.code) parts.push(d.code);
          if (d.provider) parts.push(d.provider);
          if (d.upstreamStatus) parts.push('upstream ' + d.upstreamStatus);
          if (d.model) parts.push(d.model);
          const prefix = parts.length ? '[' + parts.join(' • ') + '] ' : '';
          msg = prefix + (d.hint || parsed.error || msg);
        }
      } catch (_) {}
      if (response.status === 404) msg = currentLang === 'es'
        ? 'El gateway de EchoChiasm AI no está disponible en este servidor. Despliega esta versión en Netlify o usa tu propia clave en Configuración → AI Connection.'
        : 'The EchoChiasm AI gateway is not available on this server. Deploy this version on Netlify or use your own key in Settings → AI Connection.';
      throw new Error(msg);
    }
    const data = await response.json();
    return {
      text: String(data.text || '').trim(),
      stopReason: data.stopReason || null,
      diagnostic: data.diagnostic || null
    };
  }

  // Advanced BYO adapter: preserves v80's direct Anthropic behavior.
  if (!apiKey) throw new Error(s().enterKeyFirst);
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({
      model: request.modelHint,
      max_tokens: request.maxTokens,
      system: [
        { type: "text", text: request.systemPrompt, cache_control: { type: "ephemeral", ttl: "1h" } }
      ],
      messages
    })
  });
  if (!response.ok) {
    const errBody = await response.text().catch(() => '');
    let msg = "Request failed (" + response.status + ")";
    try { const parsed = JSON.parse(errBody); if (parsed.error && parsed.error.message) msg = parsed.error.message; } catch (e) {}
    throw new Error(msg);
  }
  const data = await response.json();
  const text = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("\n").trim();
  return {
    text,
    stopReason: data.stop_reason || null,
    diagnostic: { provider: 'anthropic-byo', model: request.modelHint }
  };
}

async function callAnthropic(apiKey, userText, systemPrompt, model, maxTokens, task) {
  return callAI(apiKey, userText, systemPrompt, model, maxTokens, task);
}
