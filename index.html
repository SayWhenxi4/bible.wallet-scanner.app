<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<script>
  // Applied before first paint so returning visitors don't see a flash of
  // the wrong theme while the rest of the page loads. Dark is the default
  // for anyone who hasn't chosen yet — an explicit stored 'light' choice
  // is always respected, this only affects first-time/undecided visitors.
  try {
    const storedTheme = localStorage.getItem('echochiasm_theme');
    if (storedTheme === 'dark' || storedTheme === null) {
      document.documentElement.setAttribute('data-theme', 'dark');
    } else if (storedTheme === 'inverted') {
      document.documentElement.setAttribute('data-theme', 'inverted');
    }
  } catch (e) {}
</script>
<title>EchoChiasm</title>
<meta name="theme-color" content="#0E3B3C">
<meta name="description" content="Bible reader and study tool — chiasm, focal climax, and inclusio — with Hebrew and Greek word insight.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="EchoChiasm">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* v70 Light — pearlescent media-app glass with a restrained rainbow aura. */
    --bg: #F7F9FF;
    --bg-soft: #EEF2FA;
    --header: #172238;
    --header-dark: #0F1728;
    --header-light: #24314A;
    --cream: #FFFFFF;
    --on-dark: #FFFFFF;
    --ink: #172236;
    --ink-soft: #657086;
    --terracotta: #D79A4B;
    --terracotta-dark: #B77A31;
    --terracotta-soft: #F0BB73;
    --gold: #D79A4B;
    --gold-bright: #F3C77F;
    --accent: #B77A31;
    --accent-bright: #D79A4B;
    --sage: #789B84;
    --line: rgba(41,56,87,0.12);
    --shadow: rgba(39,55,85,0.12);
  }

  :root[data-theme="dark"] {
    /* v70 Dark — media-app charcoal/navy, softer than Inverted but still luminous. */
    --bg: #151A24;
    --bg-soft: #202737;
    --header: #171D2A;
    --header-dark: #10151F;
    --header-light: #252D3E;
    --cream: #1C2330;
    --on-dark: #F7F9FF;
    --ink: #EEF2FA;
    --ink-soft: #AEB8CA;
    --terracotta: #DDA153;
    --terracotta-dark: #B77E37;
    --terracotta-soft: #EFB976;
    --gold: #DDA153;
    --gold-bright: #FFD08A;
    --accent: #DDA153;
    --accent-bright: #EFB976;
    --sage: #84A68E;
    --line: rgba(181,194,221,0.15);
    --shadow: rgba(0,0,0,0.38);
  }

  :root[data-theme="inverted"] {
    /* v70 Inverted — deepest media-app navy/black with the strongest rainbow glow. */
    --bg: #0A0E17;
    --bg-soft: #161D2E;
    --header: #111726;
    --header-dark: #080C14;
    --header-light: #182137;
    --cream: #111726;
    --on-dark: #F7F9FF;
    --ink: #E8EDF8;
    --ink-soft: #A6B0C5;
    --terracotta: #E0A458;
    --terracotta-dark: #B57D36;
    --terracotta-soft: #F0BD7A;
    --gold: #E0A458;
    --gold-bright: #FFD08A;
    --accent: #E0A458;
    --accent-bright: #F0BD7A;
    --sage: #86AA91;
    --line: rgba(154,174,214,0.18);
    --shadow: rgba(0,0,0,0.48);
  }

  html { color-scheme: light; }
  html[data-theme="dark"], html[data-theme="inverted"] { color-scheme: dark; }

  /* v70 — the media-app rainbow atmosphere now belongs to all three themes.
     Light is airy, Dark is restrained, Inverted keeps the dramatic v69 look. */
  @property --echo-rainbow-angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
  @keyframes echoRainbowSpin { to { --echo-rainbow-angle: 360deg; } }
  body {
    background:
      radial-gradient(circle at 18% 12%, rgba(74,123,255,.055), transparent 34%),
      radial-gradient(circle at 82% 24%, rgba(255,126,76,.045), transparent 32%),
      radial-gradient(circle at 50% 82%, rgba(53,208,127,.04), transparent 38%),
      var(--bg);
  }
  html[data-theme="dark"] body {
    background:
      radial-gradient(circle at 18% 12%, rgba(74,123,255,.085), transparent 34%),
      radial-gradient(circle at 82% 24%, rgba(255,91,76,.06), transparent 32%),
      radial-gradient(circle at 50% 82%, rgba(53,208,127,.05), transparent 38%),
      var(--bg);
  }
  html[data-theme="inverted"] body {
    background:
      radial-gradient(circle at 18% 12%, rgba(74,123,255,.10), transparent 34%),
      radial-gradient(circle at 82% 24%, rgba(255,59,48,.08), transparent 32%),
      radial-gradient(circle at 50% 82%, rgba(53,208,127,.07), transparent 38%),
      var(--bg);
  }
  body::before {
    content: "";
    position: fixed;
    left: 50%;
    top: 46%;
    width: min(96vw, 760px);
    height: min(74vh, 760px);
    transform: translate(-50%, -50%);
    border-radius: 44%;
    background: conic-gradient(from var(--echo-rainbow-angle), #ff3b30, #ff8a1e, #ffd60a, #35d07f, #34c7ff, #4a7bff, #ff3b30);
    filter: blur(90px);
    opacity: .065;
    animation: echoRainbowSpin 11s linear infinite;
    pointer-events: none;
    z-index: 0;
  }
  html[data-theme="dark"] body::before { opacity: .10; }
  html[data-theme="inverted"] body::before { opacity: .13; animation-duration: 9s; }

  /* Keep content above the ambient glow WITHOUT flattening the app's real
     interactive z-indexes. v69 accidentally gave .topbar z-index:1, letting
     later content sit above visible buttons and intercept taps on iOS. */
  .content-wrap { position: relative; z-index: 1; }
  .topbar { z-index: 30; }
  .bottom-fixed-stack { z-index: 40; }

  /* Shared dark-surface contrast safeguards. */
  html[data-theme="dark"] .verse-line,
  html[data-theme="inverted"] .verse-line { color: #EDF2FC; }
  html[data-theme="dark"] .verse-line sup,
  html[data-theme="inverted"] .verse-line sup { color: #F0BD7A; }
  html[data-theme="dark"] .verse-line.selected,
  html[data-theme="inverted"] .verse-line.selected {
    background: rgba(224,164,88,.16);
    box-shadow: inset 3px 0 0 rgba(224,164,88,.72);
  }
  html[data-theme="dark"] .verse-line.reading,
  html[data-theme="inverted"] .verse-line.reading {
    background: rgba(110,168,122,.18);
    box-shadow: inset 4px 0 0 #86AA91, 0 0 18px rgba(110,168,122,.10);
  }
  html[data-theme="dark"] .verse-line.highlighted,
  html[data-theme="inverted"] .verse-line.highlighted {
    outline: 1px solid rgba(255,255,255,.12);
    color: #FFFFFF;
  }
  html[data-theme="dark"] .verse-line.highlighted.reading,
  html[data-theme="inverted"] .verse-line.highlighted.reading {
    box-shadow: inset 4px 0 0 #FFD08A, 0 0 0 1px rgba(255,208,138,.28), 0 0 18px rgba(224,164,88,.18);
  }
  html[data-theme="dark"] .output-card,
  html[data-theme="dark"] .sheet,
  html[data-theme="dark"] .chapter-nav-row button,
  html[data-theme="inverted"] .output-card,
  html[data-theme="inverted"] .sheet,
  html[data-theme="inverted"] .chapter-nav-row button {
    background: color-mix(in srgb, var(--cream) 94%, transparent);
    color: var(--ink);
    border-color: var(--line);
  }
  html[data-theme="dark"] .output-card,
  html[data-theme="inverted"] .output-card {
    border-left-color: var(--terracotta);
    box-shadow: 0 12px 34px rgba(0,0,0,.34), 0 0 0 1px rgba(224,164,88,.06);
  }
  html[data-theme="dark"] .study-chunk.reading,
  html[data-theme="inverted"] .study-chunk.reading {
    background: rgba(224,164,88,.13);
    box-shadow: inset 4px 0 0 var(--terracotta), 0 0 18px rgba(224,164,88,.10);
  }
  html[data-theme="dark"] .wordplay-legend,
  html[data-theme="inverted"] .wordplay-legend {
    background: rgba(224,164,88,.10);
    border-color: rgba(224,164,88,.30);
  }
  html[data-theme="dark"] .library-badge,
  html[data-theme="inverted"] .library-badge {
    background: rgba(110,168,122,.10);
    border-color: rgba(110,168,122,.28);
  }

  /* Light theme gets a crisp glass-card treatment while preserving dark text,
     saved highlight colors, and the green reading marker. */
  html:not([data-theme]) .card,
  html:not([data-theme]) .output-card,
  html:not([data-theme]) .sheet,
  html:not([data-theme]) .chapter-nav-row button {
    background: rgba(255,255,255,.88);
    border-color: rgba(41,56,87,.12);
    box-shadow: 0 10px 28px rgba(42,58,91,.09);
  }
  html:not([data-theme]) .verse-line.reading {
    background: rgba(120,155,132,.16);
    box-shadow: inset 4px 0 0 #789B84;
    color: #263A33;
  }
  html:not([data-theme]) .verse-line.highlighted.reading {
    box-shadow: inset 4px 0 0 #B77A31, 0 0 0 1px rgba(183,122,49,.18);
  }

  /* All themes share the media-app microphone halo; intensity follows theme. */
  #floating-ask-ai-mic {
    isolation: isolate;
  }
  #floating-ask-ai-mic::before {
    content: "";
    position: absolute;
    inset: -12px;
    border-radius: 50%;
    background: conic-gradient(from var(--echo-rainbow-angle), #ff3b30, #ff8a1e, #ffd60a, #35d07f, #34c7ff, #4a7bff, #ff3b30);
    filter: blur(13px);
    opacity: .34;
    animation: echoRainbowSpin 4.5s linear infinite;
    pointer-events: none;
    z-index: -1;
  }
  html[data-theme="dark"] #floating-ask-ai-mic,
  html[data-theme="inverted"] #floating-ask-ai-mic {
    background: color-mix(in srgb, var(--cream) 86%, transparent);
    border-color: var(--terracotta);
    color: var(--terracotta-soft);
    box-shadow: 0 12px 34px rgba(0,0,0,.46), inset 0 1px 0 rgba(255,255,255,.10);
  }
  html:not([data-theme]) #floating-ask-ai-mic {
    background: rgba(255,255,255,.82);
    border-color: var(--terracotta);
    color: var(--terracotta-dark);
    box-shadow: 0 12px 32px rgba(42,58,91,.16), inset 0 1px 0 rgba(255,255,255,.9);
  }
  html[data-theme="inverted"] #floating-ask-ai-mic::before { opacity: .48; }
  #floating-ask-ai-mic.listening::before { opacity: .24; }
  #floating-ask-ai-mic.thinking::before,
  #floating-ask-ai-mic.speaking::before,
  #floating-ask-ai-mic.awaiting::before { opacity: .40; }

  @media (prefers-reduced-motion: reduce) {
    body::before, #floating-ask-ai-mic::before {
      animation: none;
      --echo-rainbow-angle: 45deg;
    }
  }

  .icon-svg { width: 19px; height: 19px; display: block; }
  .icon-svg-sm { width: 15px; height: 15px; display: block; }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
  }

  body {
    color: var(--ink);
    font-family: 'Jost', sans-serif;
    min-height: 100dvh;
    padding: 0;
  }

  /* ---- Top bar ---- */
  .topbar {
    background: var(--header); /* fallback if color-mix/backdrop-filter unsupported */
    background: linear-gradient(180deg,
      color-mix(in srgb, var(--header-light) 92%, transparent) 0%,
      color-mix(in srgb, var(--header) 90%, transparent) 45%,
      color-mix(in srgb, var(--header-dark) 92%, transparent) 100%);
    -webkit-backdrop-filter: blur(22px) saturate(180%);
    backdrop-filter: blur(22px) saturate(180%);
    border-bottom: 1px solid rgba(255,255,255,0.14);
    padding: 12px 10px;
    padding-top: calc(12px + env(safe-area-inset-top));
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.16);
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 30;
  }

  /* v71 — keep the top navigation solid at all times. Only the reading/study
     transport fades, and it wakes only when the user interacts with that bar.
     Automatic verse scrolling must never make it pulse in and out. */
  .topbar { transition: background .2s ease, box-shadow .2s ease; opacity: 1 !important; }
  .topbar.chrome-idle { opacity: 1 !important; }
  .audio-bar { transition: opacity .42s ease, transform .42s ease; }
  .audio-bar.chrome-idle { opacity: .32; transform: translateY(2px); }
  .audio-bar:hover, .audio-bar:focus-within { opacity: 1; }

  .icon-round-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.09);
    -webkit-backdrop-filter: blur(10px) saturate(160%);
    backdrop-filter: blur(10px) saturate(160%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.15), 0 1px 3px rgba(0,0,0,0.12);
    color: var(--gold-bright);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  .icon-round-btn:active { background: rgba(255,255,255,0.18); }

  .topbar-center {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }

  .selector-pill {
    background: rgba(255,255,255,0.11);
    border: 1px solid rgba(255,255,255,0.18);
    -webkit-backdrop-filter: blur(10px) saturate(160%);
    backdrop-filter: blur(10px) saturate(160%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.15);
    color: var(--on-dark);
    font-family: 'Jost', sans-serif;
    font-weight: 500;
    font-size: 14.5px;
    padding: 8px 12px;
    border-radius: 16px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 44vw;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-variant-numeric: lining-nums;
    transition: background 0.15s;
  }
  .selector-pill:active { background: rgba(255,255,255,0.16); }
  .selector-pill .icon-svg-sm { opacity: 0.7; flex-shrink: 0; }

  .brand-wordmark {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 700;
    font-size: 19px;
    color: var(--on-dark);
    letter-spacing: 0.02em;
  }

  /* ---- Overlays (bottom sheets) ---- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(43,33,24,0.45);
    z-index: 50;
    display: none;
    align-items: flex-end;
    justify-content: center;
  }
  .overlay.show { display: flex; }

  .sheet {
    background: var(--cream);
    background: color-mix(in srgb, var(--cream) 86%, transparent);
    -webkit-backdrop-filter: blur(26px) saturate(160%);
    backdrop-filter: blur(26px) saturate(160%);
    border: 1px solid color-mix(in srgb, var(--ink) 6%, transparent);
    border-bottom: none;
    width: 100%;
    max-width: 640px;
    border-radius: 22px 22px 0 0;
    padding: 10px 20px calc(24px + env(safe-area-inset-bottom));
    max-height: 82vh;
    overflow-y: auto;
    box-shadow: 0 -8px 32px rgba(0,0,0,0.2);
    transition: transform 0.28s cubic-bezier(.2,.8,.2,1), max-height 0.28s cubic-bezier(.2,.8,.2,1);
  }
  .sheet.expanded { max-height: 94vh; }
  .sheet.dragging { transition: none; } /* live 1:1 finger tracking while actively dragging */

  .sheet-grabber {
    width: 100%;
    height: 34px;
    margin: -10px 0 -6px;
    padding-top: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
  }
  .sheet-grabber::after {
    content: "";
    width: 36px;
    height: 4px;
    border-radius: 2px;
    background: var(--line);
  }
  .sheet-grabber, .sheet-header {
    touch-action: none; /* the drag handle area only — leaves the sheet's own content scroll untouched */
    cursor: grab;
  }
  .sheet.dragging .sheet-grabber, .sheet.dragging .sheet-header { cursor: grabbing; }

  .sheet-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .sheet-title {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 700;
    font-size: 20px;
    color: var(--ink);
  }
  .sheet-close {
    background: var(--bg-soft);
    border: none;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    color: var(--ink-soft);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .sheet-header-actions {
    display: flex;
    align-items: center;
    gap: 18px; /* deliberate spacing so back and close never get hit by the same tap */
  }
  .sheet-back {
    background: var(--bg-soft);
    border: none;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    color: var(--ink-soft);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ---- Hamburger menu ---- */
  .menu-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 4px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    font-size: 15px;
    color: var(--ink);
  }
  .menu-row:last-child { border-bottom: none; }
  .menu-row-label {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .menu-row-label .icon-svg { color: var(--terracotta); opacity: 0.85; }
  .menu-row-chevron { color: var(--ink-soft); opacity: 0.5; }
  .menu-lang-toggle {
    display: flex;
    gap: 6px;
  }
  .menu-lang-toggle button {
    font-family: 'Jost', sans-serif;
    font-size: 11.5px;
    font-weight: 500;
    letter-spacing: 0.05em;
    padding: 6px 13px;
    border: 1px solid var(--line);
    background: var(--bg-soft);
    color: var(--ink-soft);
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .menu-lang-toggle button.active {
    background: var(--terracotta);
    color: var(--on-dark);
    border-color: var(--terracotta);
  }

  /* ---- Settings ---- */
  .settings-label {
    font-size: 11.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--terracotta);
    font-weight: 500;
    margin-bottom: 8px;
    display: block;
  }
  .key-input-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .key-input {
    flex: 1;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px;
    font-family: 'Jost', sans-serif;
    font-size: 14px;
    color: var(--ink);
  }
  .key-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  .icon-btn {
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 0 14px;
    font-size: 13px;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .settings-actions { display: flex; gap: 10px; margin: 14px 0 6px; }
  .btn-primary {
    flex: 1;
    background: linear-gradient(160deg, var(--terracotta-soft), var(--terracotta-dark));
    color: var(--on-dark);
    border: none;
    border-radius: 20px;
    padding: 12px;
    font-family: 'Jost', sans-serif;
    font-weight: 500;
    font-size: 13.5px;
    letter-spacing: 0.04em;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(176,103,74,0.25);
  }
  .btn-primary:disabled { opacity: 0.55; box-shadow: none; }
  .btn-ghost {
    flex: 1;
    background: var(--bg-soft);
    color: var(--ink-soft);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 12px;
    font-family: 'Jost', sans-serif;
    font-weight: 500;
    font-size: 13.5px;
    letter-spacing: 0.04em;
    cursor: pointer;
  }
  .conn-status { font-size: 12.5px; text-align: center; margin: 10px 0; min-height: 16px; }
  .conn-status.ok { color: var(--sage); }
  .conn-status.fail { color: var(--terracotta); }
  .settings-help {
    background: var(--bg-soft);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 12.5px;
    line-height: 1.55;
    color: var(--ink-soft);
    margin-top: 16px;
  }
  .settings-help a { color: var(--terracotta); }
  .settings-help ol { margin: 6px 0 0; padding-left: 18px; }

  .voice-settings-section {
    margin-top: 28px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
  }
  .voice-lang-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .voice-lang-tab {
    flex: 1;
    padding: 8px;
    border: 1px solid var(--line);
    background: var(--bg-soft);
    color: var(--ink-soft);
    border-radius: 12px;
    font-family: 'Jost', sans-serif;
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
  }
  .voice-lang-tab.active {
    background: var(--terracotta);
    color: var(--on-dark);
    border-color: var(--terracotta);
  }
  #text-size-s   { font-size: 12px; }
  #text-size-m   { font-size: 15px; }
  #text-size-l   { font-size: 18px; }
  #text-size-xl  { font-size: 21px; }
  .voice-sub-label {
    display: block;
    font-size: 11px;

  .seal-row { display: flex; justify-content: center; margin: 22px 0; }
  .seal {
    position: relative;
    width: 100%;
    max-width: 280px;

  .seal:active { transform: scale(0.97); box-shadow: 0 3px 10px rgba(176,103,74,0.28); }

  .seal .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--on-dark); display: inline-block; }

  @keyframes pulse { 0%, 100% { opacity: 0.4; transform: scale(0.85); } 50% { opacity: 1; transform: scale(1.15); } }

  .seal::after {

    position: absolute;
    inset: -6px;
    border-radius: 32px;
    border: 3px solid var(--gold-bright);
    opacity: 0;
    pointer-events: none;

const SYSTEM_PROMPT_EN = `You are a Bible study formatting tool called EchoChiasm. Format the given Bible verse or passage into EchoChiasm study notes, matching the layout below exactly.

FORMATTING RULES:
- NEVER use asterisks (*), underscores (_), or hashes (#).
- Use • for bullet points.
- For emphasis use CAPITALS or an emoji, not bold.
- Put ONE blank line between every section.
- Keep the exact section headers and emojis shown below.
- Output in English.

CONTENT RULES:

1. Structure: identify which pattern is genuinely present — do not force a passage into a shape it doesn't have. Choose one or more:

   CHIASM — only when order genuinely mirrors (A B B' A', or A B C B' A'), verified line by line. Label A/B/C and A'/B'/C'. Put the true structural center on its own line, in CAPITALS, as CENTER (KEY FOCUS) — no emoji, no bracket, no inline confidence tag. Do NOT tag individual lines with (clear)/(probable)/(loose) or similar labels. If — and only if — part of the structure is genuinely uncertain, say so once, in a single plain sentence placed right after the structure (e.g. "The B/B' pairing here is a lighter parallel than the rest of the structure.").

   FOCAL CLIMAX — for verses that build toward an emphatic peak WITHOUT mirrored order (common in Hebrew poetry as climactic parallelism). Label the build A/B/C in sequence and mark the climactic line on its own line, in CAPITALS, as FOCAL POINT (KEY EMPHASIS) — no emoji. Same rule on confidence: one plain sentence if something is uncertain, never per-line tags.

   INCLUSIO — for frame structures where the same phrase opens and closes a unit (a verse, a paragraph, or the whole book). Note both bracketing references explicitly, and name what is held inside the frame.

   A single passage may exhibit more than one — e.g. a verse can be climactic parallelism on its own while also serving as half of a book-level inclusio. Note both when genuinely present, but keep them labeled separately rather than collapsing one into the other.

2. Language layer: OT -> analyze Hebrew. NT -> analyze GREEK word in the text.

3. Pictographs: give the lexical meaning first, as normal prose — never skip this. THEN, only when the root has 2-4 letters with known pictographic meanings AND assembling them genuinely yields a coherent devotional sentence (not a forced or generic one), add the reveal block below, using this EXACT syntax, each on its own line, with no other text on those lines. This is the one deliberate exception to the no-symbols rule — the app parses these markers into a visual reveal, so the syntax must be exact:

// ==================== SHEET DRAG (expand/dismiss) ====================
// Every bottom sheet (Menu, Settings, pickers, Highlights, History, etc.)
// shares the .sheet / .sheet-grabber markup, so this is attached once,
// generically, to all of them. Drag down on the grabber or header past a
// threshold to dismiss; drag up to expand the sheet taller (useful for
// content — like Settings — that gets cut off at the default max-height).
const SHEET_DISMISS_THRESHOLD = 90;   // px dragged down before it counts as a dismiss
const SHEET_EXPAND_THRESHOLD = 50;    // px dragged up before it snaps to the expanded state
const SHEET_BASE_VH = 82;             // matches .sheet's default max-height in CSS
const SHEET_EXPANDED_CAP_VH = 94;     // matches .sheet.expanded's max-height in CSS

function attachSheetDrag(sheet) {
  const overlay = sheet.closest('.overlay');
  if (!overlay) return;
  const handles = [sheet.querySelector('.sheet-grabber'), sheet.querySelector('.sheet-header')].filter(Boolean);
  if (!handles.length) return;

  let dragging = false;
  let startY = 0;
  let mode = null; // 'down' | 'up'

  function onDown(e) {
    // Let taps on the close button (or any control in the header) behave normally.
    if (e.target.closest('button, a, input, select, textarea')) return;
    dragging = true;
    mode = null;
    startY = e.clientY;
    sheet.classList.add('dragging');
    try { e.target.setPointerCapture(e.pointerId); } catch (err) {}
  }

  function onMove(e) {
    if (!dragging) return;
    const deltaY = e.clientY - startY;
    if (Math.abs(deltaY) < 4) return; // small deadzone before committing to a direction
    if (deltaY > 0) {
      mode = 'down';
      sheet.style.maxHeight = '';
      sheet.classList.remove('expanded');
      sheet.style.transform = `translateY(${deltaY}px)`;
    } else {
      mode = 'up';
      sheet.style.transform = '';
      const grownVh = Math.min(SHEET_EXPANDED_CAP_VH, SHEET_BASE_VH + (-deltaY) / window.innerHeight * 100);
      sheet.style.maxHeight = grownVh + 'vh';
    }
  }

  function onUp(e) {
    if (!dragging) return;
    dragging = false;
    sheet.classList.remove('dragging');
    const deltaY = e.clientY - startY;

    if (mode === 'down') {
      sheet.style.transform = '';
      if (deltaY > SHEET_DISMISS_THRESHOLD) closeOverlay(overlay.id);
      // else: transition (re-enabled now that 'dragging' is removed) snaps it back
    } else if (mode === 'up') {
      sheet.style.maxHeight = '';
      if (-deltaY > SHEET_EXPAND_THRESHOLD) sheet.classList.add('expanded');
      else sheet.classList.remove('expanded');
    }
    mode = null;
  }

  handles.forEach((h) => h.addEventListener('pointerdown', onDown));
  document.addEventListener('pointermove', onMove);

// ==================== SWIPE TO CHANGE CHAPTER ====================
// Horizontal fling on the Bible reading pane advances to the next/previous
// chapter — the on-screen Prev/Next buttons still work too, this just adds
// a faster path so you don't have to scroll to the bottom of a chapter to
// reach them. Uses touchstart/touchend only (no touchmove handling, no
// preventDefault), so normal vertical scrolling and tap-to-select-verse are
// completely untouched — this only ever fires on release, and only when the
// motion was clearly horizontal.
(function attachChapterSwipe() {
  const el = document.getElementById('reading-content');
  if (!el) return;
  const SWIPE_MIN_DISTANCE = 70;  // px horizontal travel required
  const SWIPE_MAX_VERTICAL = 60;  // px — beyond this it reads as a scroll, not a swipe
  let startX = 0, startY = 0, tracking = false;

  el.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) { tracking = false; return; }
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    tracking = true;
  }, { passive: true });

  el.addEventListener('touchmove', (e) => {
    if (!tracking || e.touches.length !== 1) return;
    // If it turns into a mostly-vertical drag, bail early — leaves scrolling alone.
    if (Math.abs(e.touches[0].clientY - startY) > SWIPE_MAX_VERTICAL) tracking = false;
  }, { passive: true });

  el.addEventListener('touchend', (e) => {
    if (!tracking) return;
    tracking = false;
    if (selectedVerses.length > 0) return; // don't navigate away mid-selection
    const touch = e.changedTouches[0];
    const deltaX = touch.clientX - startX;
    const deltaY = touch.clientY - startY;
    if (Math.abs(deltaY) > SWIPE_MAX_VERTICAL) return;
    if (Math.abs(deltaX) < SWIPE_MIN_DISTANCE) return;
    if (deltaX < 0) goToNextChapter();
    else goToPrevChapter();
  }, { passive: true });

  el.addEventListener('touchcancel', () => { tracking = false; }, { passive: true });
})();

const HIGHLIGHT_COLORS = [
  { id: 'yellow', hex: '#E3C558' },
  { id: 'pink',   hex: '#D9789B' },
  { id: 'purple', hex: '#9B7BC4' },
  { id: 'green',  hex: '#7FAE6B' },

];

function getHighlights() {
  try {
    const raw = localStorage.getItem('echochiasm_highlights');
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}

function saveHighlightsList(list) {
  localStorage.setItem('echochiasm_highlights', JSON.stringify(list));
}

function findHighlightIndex(list, lang, bookIdx, chapterIdx, verseIdx) {
  return list.findIndex(h => h.lang === lang && h.bookIndex === bookIdx && h.chapterIndex === chapterIdx && h.verseIndex === verseIdx);
}

function getHighlightFor(bookIdx, chapterIdx, verseIdx) {
  const list = getHighlights();
  const idx = findHighlightIndex(list, currentLang, bookIdx, chapterIdx, verseIdx);
  return idx >= 0 ? list[idx] : null;
}

function setHighlight(bookIdx, chapterIdx, verseIdx, colorId) {
  const list = getHighlights();
  const idx = findHighlightIndex(list, currentLang, bookIdx, chapterIdx, verseIdx);
  const m = bookMeta[bookIdx];
  const text = bibleData[currentLang][bookIdx][chapterIdx][verseIdx];
  const record = {
    lang: currentLang,
    bookIndex: bookIdx,
    chapterIndex: chapterIdx,
    verseIndex: verseIdx,
    color: colorId,
    ref: `${bookDisplayName(m)} ${chapterIdx + 1}:${verseIdx + 1}`,
    text: text,
    savedAt: Date.now()
  };
  if (idx >= 0) { list[idx] = record; } else { list.push(record); }
  saveHighlightsList(list);
}

function removeHighlight(bookIdx, chapterIdx, verseIdx) {
  const list = getHighlights();
  const idx = findHighlightIndex(list, currentLang, bookIdx, chapterIdx, verseIdx);
  if (idx >= 0) { list.splice(idx, 1); saveHighlightsList(list); }
}

let longPressTimer = null;
let longPressTriggered = false;

function attachLongPress(el, onLongPress) {
  let startX = 0, startY = 0;
  const start = (e) => {
    longPressTriggered = false;
    startX = e.clientX; startY = e.clientY;
    longPressTimer = setTimeout(() => {
      longPressTriggered = true;
      onLongPress(e);
    }, 480);
  };
  const cancel = () => { clearTimeout(longPressTimer); };
  const moveCheck = (e) => {
    if (Math.abs(e.clientX - startX) > 12 || Math.abs(e.clientY - startY) > 12) cancel();
  };
  el.addEventListener('pointerdown', start);
  el.addEventListener('pointerup', cancel);
  el.addEventListener('pointercancel', cancel);
  el.addEventListener('pointermove', moveCheck);
  el.addEventListener('contextmenu', (e) => e.preventDefault());
}

let highlightPickerTarget = null; // { bookIndex, chapterIndex, verseIndex }

function openHighlightPicker(bookIdx, chapterIdx, verseIdx) {
  highlightPickerTarget = { bookIndex: bookIdx, chapterIndex: chapterIdx, verseIndex: verseIdx };

function hexToRgba(hex, alpha) {
  const clean = hex.replace('#', '');
  const r = parseInt(clean.substring(0, 2), 16);
  const g = parseInt(clean.substring(2, 4), 16);
  const b = parseInt(clean.substring(4, 6), 16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
}

function applyHighlightsToView() {
  document.querySelectorAll('.verse-line').forEach(el => {
    const vIdx = parseInt(el.dataset.verse, 10);
    const h = getHighlightFor(currentBook, currentChapter, vIdx);
    if (h) {
      el.classList.add('highlighted');
      const colorObj = HIGHLIGHT_COLORS.find(c => c.id === h.color);
      el.style.setProperty('--verse-highlight-color', hexToRgba(colorObj ? colorObj.hex : '#E3C558', 0.35));
    } else {
      el.classList.remove('highlighted');
      el.style.removeProperty('--verse-highlight-color');
    }
  });
}

function logReadingHistory(bookIdx, chapterIdx, lang) {
  try {
    const raw = localStorage.getItem('echochiasm_reading_history');
    const list = raw ? JSON.parse(raw) : [];
    const key = `${lang}:${bookIdx}:${chapterIdx}`;
    const existingIdx = list.findIndex(e => e.key === key);
    const m = bookMeta[bookIdx];
    const entry = { key, lang, bookIndex: bookIdx, chapterIndex: chapterIdx, ref: `${bookDisplayName(m)} ${chapterIdx + 1}`, savedAt: Date.now() };
    if (existingIdx >= 0) { list.splice(existingIdx, 1); }
    list.push(entry);
    while (list.length > 200) list.shift();
    localStorage.setItem('echochiasm_reading_history', JSON.stringify(list));
  } catch (e) {}
}

function formatHistoryDate(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString(currentLang === 'es' ? 'es-ES' : 'en-US', { day: 'numeric', month: 'short', year: 'numeric' });
}

function formatHistoryTime(ts) {
  const d = new Date(ts);
  return d.toLocaleTimeString(currentLang === 'es' ? 'es-ES' : 'en-US', { hour: 'numeric', minute: '2-digit' });
}

function openHistoryList() {
  document.getElementById('history-overlay-title').textContent = s().historyTitle;

let currentBook = parseInt(localStorage.getItem('echochiasm_last_book') || '0', 10);
let currentChapter = parseInt(localStorage.getItem('echochiasm_last_chapter') || '0', 10);
let selectedVerses = []; // {verseIndex}

// Manual double-tap tracking for verse taps (see click handler in
// renderReadingView for why this replaces native dblclick).
let verseTapTimer = null;
let verseTapVerseIndex = null;
const VERSE_DOUBLE_TAP_MS = 320; // window between taps to count as a double-tap

async function ensureBookMeta() {
  if (bookMeta) return bookMeta;
  const resp = await fetch('bible/book_meta.json');
  if (!resp.ok) throw new Error('book_meta.json ' + resp.status + ' ' + resp.statusText);
  bookMeta = await resp.json();
  return bookMeta;
}

async function ensureBibleData(lang) {
  if (bibleData[lang]) return bibleData[lang];
  document.getElementById('reading-content').innerHTML = `<div class="empty-note">${s().loadingBible}</div>`;
  const resp = await fetch('bible/bible_' + lang + '.json');
  if (!resp.ok) throw new Error('bible_' + lang + '.json ' + resp.status + ' ' + resp.statusText);
  bibleData[lang] = await resp.json();
  return bibleData[lang];
}

function bookDisplayName(m) { return currentLang === 'es' ? m.es : m.en; }

function saveLastPosition() {
  localStorage.setItem('echochiasm_last_book', String(currentBook));
  localStorage.setItem('echochiasm_last_chapter', String(currentChapter));
}

// ==================== TOP BAR ====================

function renderTopbar() {
  const center = document.getElementById('topbar-center');
  if (currentView === 'bible') {
    const m = bookMeta ? bookMeta[currentBook] : null;
    const bookLabel = m ? bookDisplayName(m) : '…';

// ==================== BIBLE READING VIEW ====================

async function renderReadingView() {
  // A chapter switch mid-Ask-AI-conversation would leave the session's
  // remaining turns arguing from a passage that's no longer on screen —
  // finalize it first (which saves it, if it was a real back-and-forth)
  // rather than let it silently carry stale context into a new chapter.
  if (askAI.active) finalizeAskSession();
  try {
    await ensureBookMeta();
    const data = await ensureBibleData(currentLang);
    const m = bookMeta[currentBook];
    const verses = data[currentBook][currentChapter];
    const chapterCount = data[currentBook].length;

    let html = `<div class="reading-header"><span class="reading-header-title">${escapeHtml(bookDisplayName(m))} ${currentChapter + 1}</span>${speechSupported ? `<button class="ask-ai-btn" id="ask-ai-btn" aria-label="${s().askAi}" title="${s().askAi}"><svg class="icon-svg-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg></button>` : `<span></span>`}<button class="listen-btn" id="listen-btn"><svg class="icon-svg-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg><span>${s().listen}</span></button></div>`;
    verses.forEach((text, vIdx) => {
      const isSelected = selectedVerses.includes(vIdx);
      html += `<div class="verse-line${isSelected ? ' selected' : ''}" data-verse="${vIdx}"><sup>${vIdx + 1}</sup>${escapeHtml(text)}</div>`;
    });

    html += `<div class="chapter-nav-row">
      <button id="prev-chapter-btn" ${currentChapter === 0 && currentBook === 0 ? 'disabled' : ''}><svg class="icon-svg-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>${s().prev}</button>
      <button id="next-chapter-btn" ${currentChapter === chapterCount - 1 && currentBook === bookMeta.length - 1 ? 'disabled' : ''}>${s().next}<svg class="icon-svg-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>
    </div>`;

    document.getElementById('reading-content').innerHTML = html;
    renderTopbar();

    document.querySelectorAll('.verse-line').forEach(el => {
      el.addEventListener('click', () => {
        if (longPressTriggered) { longPressTriggered = false; return; }
        const vIdx = parseInt(el.dataset.verse, 10);
        // Native 'dblclick' is unreliable here: touch-action:manipulation
        // (needed to kill double-tap-to-zoom) makes iOS resolve every tap
        // straight to 'click' immediately, so it never waits around to
        // synthesize a real dblclick — each tap just fires its own
        // independent click, which is why double-tapping used to look like
        // "select, then immediately deselect." Detecting the double-tap
        // manually by timing between same-verse taps sidesteps that
        // entirely, and works identically on touch and mouse.
        if (verseTapTimer && verseTapVerseIndex === vIdx) {
          clearTimeout(verseTapTimer);
          verseTapTimer = null;
          verseTapVerseIndex = null;
          startReadAloudFrom(vIdx);
          return;
        }
        verseTapVerseIndex = vIdx;
        verseTapTimer = setTimeout(() => {
          verseTapTimer = null;
          verseTapVerseIndex = null;
          toggleVerseSelection(vIdx, el);
        }, VERSE_DOUBLE_TAP_MS);
      });
      attachLongPress(el, () => {
        openHighlightPicker(currentBook, currentChapter, parseInt(el.dataset.verse, 10));
      });
    });
    applyHighlightsToView();
    logReadingHistory(currentBook, currentChapter, currentLang);

    const prevBtn = document.getElementById('prev-chapter-btn');
    const nextBtn = document.getElementById('next-chapter-btn');
    if (prevBtn) prevBtn.onclick = goToPrevChapter;
    if (nextBtn) nextBtn.onclick = goToNextChapter;

    const listenBtn = document.getElementById('listen-btn');
    if (listenBtn) listenBtn.onclick = toggleReadAloud;
    syncListenBtnState();

    const askBtn = document.getElementById('ask-ai-btn');
    if (askBtn) askBtn.onclick = toggleAskAI;
    syncAskAiBtnState();
    FloatingAskAIMic.syncVisibility();

    window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
  } catch (err) {
    document.getElementById('reading-content').innerHTML = `
      <div class="error-box">${s().loadErrorPrefix}${escapeHtml(err.message)}</div>
      <div class="seal-row"><button class="seal" id="retry-load-btn"><span>${s().retry}</span></button></div>
    `;
    const retryBtn = document.getElementById('retry-load-btn');
    if (retryBtn) retryBtn.onclick = renderReadingView;
  }
}

async function goToPrevChapter() {
  stopReadAloud();
  const data = await ensureBibleData(currentLang);
  if (currentChapter > 0) {
    currentChapter -= 1;
  } else if (currentBook > 0) {
    currentBook -= 1;
    currentChapter = data[currentBook].length - 1;
  }
  clearSelection();
  saveLastPosition();
  renderReadingView();
}

async function goToNextChapter() {
  stopReadAloud();
  const data = await ensureBibleData(currentLang);
  const chapterCount = data[currentBook].length;
  if (currentChapter < chapterCount - 1) {
    currentChapter += 1;
  } else if (currentBook < bookMeta.length - 1) {
    currentBook += 1;
    currentChapter = 0;
  }
  clearSelection();
  saveLastPosition();
  renderReadingView();
}

function toggleVerseSelection(verseIndex, el) {
  const idx = selectedVerses.indexOf(verseIndex);
  if (idx >= 0) {
    selectedVerses.splice(idx, 1);
    el.classList.remove('selected');
  } else {
    selectedVerses.push(verseIndex);
    el.classList.add('selected');
  }
  updateSelectBar();
}

function clearSelection() {
  selectedVerses = [];
  updateSelectBar();
  document.querySelectorAll('.verse-line.selected').forEach(el => el.classList.remove('selected'));
}

function updateSelectBar() {
  const bar = document.getElementById('select-bar');
  if (selectedVerses.length === 0) {
    bar.classList.remove('show');
    return;
  }
  bar.classList.add('show');
  document.getElementById('select-count').textContent = s().selectCount(selectedVerses.length);
}

document.getElementById('select-clear-btn').onclick = clearSelection;

document.getElementById('select-send-btn').onclick = async () => {
  if (selectedVerses.length === 0) return;
  const data = await ensureBibleData(currentLang);
  const m = bookMeta[currentBook];
  const sorted = [...selectedVerses].sort((a, b) => a - b);
  const verseNums = sorted.map(v => v + 1);
  const refRange = verseNums.length === 1
    ? String(verseNums[0])
    : (isContiguous(verseNums) ? verseNums[0] + '-' + verseNums[verseNums.length - 1] : verseNums.join(','));

  const refLine = `${bookDisplayName(m)} ${currentChapter + 1}:${refRange} ${s().versionLabel}`;
  const verseLines = sorted.map(v => `${v + 1} ${data[currentBook][currentChapter][v]}`).join(' ');

  document.getElementById('input-text').value = refLine + '\n' + verseLines;

  // Remember exactly which passage this is, structurally — used as the
  // primary cache-lookup key so we never depend on re-parsing Claude's own
  // freeform header text (which varies slightly generation to generation).
  pendingStudyOrigin = { lang: currentLang, bookIndex: currentBook, chapterIndex: currentChapter, verseNums: verseNums };

  clearSelection();
  switchView('study');
};

// A manual edit means the textarea no longer reliably matches the
// structured origin captured above — fall back to text-based parsing.
document.getElementById('input-text').addEventListener('input', () => {
  pendingStudyOrigin = null;
});

function isContiguous(nums) {
  for (let i = 1; i < nums.length; i++) { if (nums[i] !== nums[i - 1] + 1) return false; }
  return true;
}

// ==================== DROPBOX CLOUD SYNC ====================
// OAuth2 PKCE (Proof Key for Code Exchange) — the correct flow for a plain
// static page with no backend server, since there's no safe place to keep
// a client secret. Nothing here ever touches Dropbox's real password; this
// only ever handles a token scoped to this app's own Dropbox folder.
// Ported from Wallet-Tracer/Breakpoint's proven implementation, adapted for
// EchoChiasm's data shape (studies + commentary index + highlights +
// reading history, rather than a single flat registry array).

const DROPBOX_APP_KEY = "yfnqj994r5srhsg";
const DROPBOX_FILE_PATH = "/echochiasm-library.json";
const DROPBOX_REDIRECT_URI = window.location.origin + window.location.pathname;

function b64url(bytes) {
  return btoa(String.fromCharCode(...new Uint8Array(bytes))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
async function sha256(str) {
  return crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
}

let dropboxAccessToken = null;
let dropboxAccessTokenExpiry = 0;

function saveDropboxRefreshToken(token) { localStorage.setItem('echochiasm_dropbox_refresh', token); }
function getDropboxRefreshToken() { return localStorage.getItem('echochiasm_dropbox_refresh'); }
function clearDropboxRefreshToken() { localStorage.removeItem('echochiasm_dropbox_refresh'); }

async function dropboxSignIn() {
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(32)));
  sessionStorage.setItem('echochiasm_dropbox_verifier', verifier);
  const challenge = b64url(await sha256(verifier));
  const params = new URLSearchParams({
    client_id: DROPBOX_APP_KEY,
    response_type: 'code',
    code_challenge: challenge,
    code_challenge_method: 'S256',
    redirect_uri: DROPBOX_REDIRECT_URI,
    token_access_type: 'offline'
  });
  window.location.href = 'https://www.dropbox.com/oauth2/authorize?' + params.toString();
}

async function handleDropboxRedirect() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  if (!code) return false;
  const verifier = sessionStorage.getItem('echochiasm_dropbox_verifier');
  sessionStorage.removeItem('echochiasm_dropbox_verifier');
  window.history.replaceState({}, '', window.location.pathname);
  if (!verifier) { setSyncStatus(s().dropboxSignInFailedNoVerifier, 'fail'); return true; }
  try {
    const resp = await fetch('https://api.dropboxapi.com/oauth2/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({
        code, grant_type: 'authorization_code',
        client_id: DROPBOX_APP_KEY,
        redirect_uri: DROPBOX_REDIRECT_URI,
        code_verifier: verifier
      })
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error_description || data.error || 'token exchange failed');
    dropboxAccessToken = data.access_token;
    dropboxAccessTokenExpiry = Date.now() + (data.expires_in * 1000);
    if (data.refresh_token) saveDropboxRefreshToken(data.refresh_token);
  } catch (err) {
    setSyncStatus(s().dropboxSignInFailed + err.message, 'fail');
  }
  return true;
}

async function dropboxEnsureAccessToken() {
  if (dropboxAccessToken && Date.now() < dropboxAccessTokenExpiry - 60000) return dropboxAccessToken;
  const refresh = getDropboxRefreshToken();
  if (!refresh) return null;
  const resp = await fetch('https://api.dropboxapi.com/oauth2/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({ grant_type: 'refresh_token', refresh_token: refresh, client_id: DROPBOX_APP_KEY })
  });
  const data = await resp.json();
  if (!resp.ok) { clearDropboxRefreshToken(); return null; }
  dropboxAccessToken = data.access_token;
  dropboxAccessTokenExpiry = Date.now() + (data.expires_in * 1000);
  return dropboxAccessToken;
}

function dropboxSignOut() {
  dropboxAccessToken = null;
  dropboxAccessTokenExpiry = 0;
  clearDropboxRefreshToken();
  updateSyncUI();
}

function setSyncStatus(text, kind) {
  const el = document.getElementById('sync-status');
  el.textContent = text;
  el.className = 'conn-status' + (kind ? ' ' + kind : '');
}

async function updateSyncUI() {
  const signedOutRow = document.getElementById('sync-signed-out-row');
  const signedInRow = document.getElementById('sync-signed-in-row');
  const signOutRow = document.getElementById('sync-signout-row');
  const token = await dropboxEnsureAccessToken();
  if (token) {
    setSyncStatus(s().dropboxConnected, 'ok');
    signedOutRow.style.display = 'none';
    signedInRow.style.display = 'flex';
    signOutRow.style.display = 'flex';
  } else {
    setSyncStatus('', '');
    signedOutRow.style.display = 'flex';
    signedInRow.style.display = 'none';
    signOutRow.style.display = 'none';
  }
}

// ---- Building and merging the sync payload ----

function gatherSyncPayload() {
  const keys = historyKeyList();
  const studies = keys.map(k => {
    const study = getStudy(k);
    return study ? { key: k, ...study } : null;
  }).filter(Boolean);

  let readingHistory = [];
  try {
    const raw = localStorage.getItem('echochiasm_reading_history');
    readingHistory = raw ? JSON.parse(raw) : [];
  } catch (e) {}

  return {
    schemaVersion: ECHOCHIASM_LIBRARY_SCHEMA_VERSION,
    contentType: 'echochiasm-library',
    appVersion: ECHOCHIASM_APP_VERSION,
    exported: new Date().toISOString(),
    studies,
    commentaryIndex: getCommentaryIndex(),
    highlights: getHighlights(),
    readingHistory
  };
}

// Merges incoming data with what's already here — never blindly overwrites.
// Studies are merged by their unique key (a timestamp, so collisions are
// only possible if the exact same study already exists here). Highlights
// and reading history are merged by their natural identity (lang + verse,
// or lang + book + chapter), keeping whichever side is more recent when
// both devices have an entry for the same thing.
function mergeSyncPayload(data) {
  const incomingSchema = Number(data && data.schemaVersion || 0);
  if (!Number.isFinite(incomingSchema) || incomingSchema < 0) throw new Error('Invalid EchoChiasm library schema.');
  if (incomingSchema > ECHOCHIASM_LIBRARY_SCHEMA_VERSION) {
    throw new Error('This backup was created by a newer EchoChiasm library format. Update the app before importing it.');
  }

  let addedStudies = 0, addedHighlights = 0, addedHistory = 0;

  // Studies
  const existingKeys = new Set(historyKeyList());
  const incomingStudies = Array.isArray(data.studies) ? data.studies : [];
  incomingStudies.forEach(study => {
    if (!study || !study.key) return;
    if (!existingKeys.has(study.key)) {
      const { key, ...rest } = study;
      saveStudy(key, rest);
      existingKeys.add(key);
      addedStudies++;
    }
  });
  setHistoryKeyList(Array.from(existingKeys));

  // Commentary index — merge key by key, preferring whichever underlying
  // study is more recently saved when both sides point at the same ref.
  const localIndex = getCommentaryIndex();
  const incomingIndex = data.commentaryIndex && typeof data.commentaryIndex === 'object' ? data.commentaryIndex : {};
  Object.keys(incomingIndex).forEach(refKey => {
    const incomingStorageKey = incomingIndex[refKey];
    const localStorageKey = localIndex[refKey];
    if (!localStorageKey) { localIndex[refKey] = incomingStorageKey; return; }
    if (localStorageKey === incomingStorageKey) return;
    const localSavedAt = (getStudy(localStorageKey) || {}).savedAt || 0;
    const incomingSavedAt = (getStudy(incomingStorageKey) || {}).savedAt || 0;
    if (incomingSavedAt > localSavedAt) localIndex[refKey] = incomingStorageKey;
  });
  saveCommentaryIndex(localIndex);

  // Highlights — merge by (lang, book, chapter, verse), newer wins on conflict
  const localHighlights = getHighlights();
  const incomingHighlights = Array.isArray(data.highlights) ? data.highlights : [];
  incomingHighlights.forEach(h => {
    if (!h) return;
    const idx = findHighlightIndex(localHighlights, h.lang, h.bookIndex, h.chapterIndex, h.verseIndex);
    if (idx < 0) {
      localHighlights.push(h);
      addedHighlights++;
    } else if ((h.savedAt || 0) > (localHighlights[idx].savedAt || 0)) {
      localHighlights[idx] = h;
    }
  });
  saveHighlightsList(localHighlights);

  // Reading history — merge by its own composite `key`, newer wins
  let localHistory = [];
  try {
    const raw = localStorage.getItem('echochiasm_reading_history');
    localHistory = raw ? JSON.parse(raw) : [];
  } catch (e) {}
  const incomingHistory = Array.isArray(data.readingHistory) ? data.readingHistory : [];
  incomingHistory.forEach(entry => {
    if (!entry || !entry.key) return;
    const idx = localHistory.findIndex(e => e.key === entry.key);
    if (idx < 0) {
      localHistory.push(entry);
      addedHistory++;
    } else if ((entry.savedAt || 0) > (localHistory[idx].savedAt || 0)) {
      localHistory[idx] = entry;
    }
  });
  while (localHistory.length > 200) localHistory.shift();
  localStorage.setItem('echochiasm_reading_history', JSON.stringify(localHistory));

  return { addedStudies, addedHighlights, addedHistory };
}

async function saveToDropbox() {
  const token = await dropboxEnsureAccessToken();
  if (!token) { setSyncStatus(s().dropboxNotConnected, 'fail'); return; }
  try {
    const payload = gatherSyncPayload();
    setSyncStatus(s().dropboxSaving, '');
    const resp = await fetch('https://content.dropboxapi.com/2/files/upload', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + token,
        'Dropbox-API-Arg': JSON.stringify({ path: DROPBOX_FILE_PATH, mode: 'overwrite' }),
        'Content-Type': 'application/octet-stream'
      },
      body: JSON.stringify(payload)
    });
    if (!resp.ok) { const err = await resp.json().catch(() => ({})); throw new Error(err.error_summary || 'upload failed'); }
    setSyncStatus(s().dropboxSaved(payload.studies.length), 'ok');
  } catch (err) {
    setSyncStatus(s().dropboxSaveFailed + err.message, 'fail');
  }
}

async function loadFromDropbox() {
  const token = await dropboxEnsureAccessToken();
  if (!token) { setSyncStatus(s().dropboxNotConnected, 'fail'); return; }
  try {
    setSyncStatus(s().dropboxLoading, '');
    const resp = await fetch('https://content.dropboxapi.com/2/files/download', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + token, 'Dropbox-API-Arg': JSON.stringify({ path: DROPBOX_FILE_PATH }) }
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      if (String(err.error_summary || '').includes('not_found')) { setSyncStatus(s().dropboxNoFileYet, 'fail'); return; }
      throw new Error(err.error_summary || 'download failed');
    }
    const text = await resp.text();
    if (!text.trim()) { setSyncStatus(s().dropboxEmptyFile, 'fail'); return; }
    const data = JSON.parse(text);
    const result = mergeSyncPayload(data);
    setSyncStatus(s().dropboxLoaded(result.addedStudies, result.addedHighlights, result.addedHistory), 'ok');
    if (currentView === 'bible') applyHighlightsToView();
  } catch (err) {
    setSyncStatus(s().dropboxLoadFailed + err.message, 'fail');
  }
}

document.getElementById('dropbox-signin-btn').onclick = dropboxSignIn;

document.getElementById('dropbox-load-btn').onclick = loadFromDropbox;

// ---- Voice / rate preferences ----

function getStoredRate(lang) {
  const raw = localStorage.getItem('echochiasm_speech_rate_' + lang);
  const val = raw ? parseFloat(raw) : NaN;
  return (!isNaN(val) && val >= 0.5 && val <= 1.5) ? val : 0.95;
}
function setStoredRate(lang, rate) {
  localStorage.setItem('echochiasm_speech_rate_' + lang, String(rate));
}
function getStoredVoiceName(lang) {
  return localStorage.getItem('echochiasm_voice_' + lang) || '';
}
function setStoredVoiceName(lang, name) {
  if (name) localStorage.setItem('echochiasm_voice_' + lang, name);
  else localStorage.removeItem('echochiasm_voice_' + lang);
}
function getVoicesForLang(lang) {
  if (!speechSupported) return [];
  const prefix = lang === 'es' ? 'es' : 'en';
  return window.speechSynthesis.getVoices().filter(v => v.lang.toLowerCase().startsWith(prefix));
}
function applyVoiceAndRate(utterance, lang) {
  utterance.rate = getStoredRate(lang);
  const voiceName = getStoredVoiceName(lang);
  if (voiceName) {
    const match = getVoicesForLang(lang).find(v => v.name === voiceName);
    if (match) utterance.voice = match;
  }
}

let readAloud = { active: false, paused: false, verseIndex: 0 };
let speechToken = 0; // invalidates stale/duplicate utterance callbacks (cancel() can fire onend on the utterance being replaced)

// Repeat is a single shared toggle across both read-aloud engines (Bible +
// Study), like a player's repeat button — it persists across track/chapter
// changes until the user turns it off, rather than resetting per-session.
let audioRepeatEnabled = false;
let readAloudStartVerseIndex = 0; // the verse/index the current repeat loop should return to

function syncListenBtnState() {
  const btn = document.getElementById('listen-btn');
  if (!btn) return;
  if (!speechSupported) { btn.style.display = 'none'; return; }

function updateAudioBar() {
  const bar = document.getElementById('audio-bar');
  const playPauseBtn = document.getElementById('audio-playpause-btn');

function toggleReadAloud() {
  // v65: the chapter button now behaves like a real Read/Pause control.
  // First press starts reading, second press pauses, next press resumes.
  if (!readAloud.active) {
    startReadAloudFrom(0);
  } else if (readAloud.paused) {
    resumeReadAloud();
    syncListenBtnState();
  } else {
    pauseReadAloud();
    syncListenBtnState();
  }
}

function startReadAloud() {
  startReadAloudFrom(0);
}

function startReadAloudFrom(idx) {
  if (!speechSupported) return;
  stopStudyReadAloud();
  readAloud = { active: true, paused: false, verseIndex: idx, currentBook: currentBook, currentChapter: currentChapter };
  readAloudStartVerseIndex = idx; // repeat loops back to wherever this listen session started, not always verse 0
  updateAudioBar();
  syncListenBtnState();
  speakVerse(idx);
}

function pauseReadAloud() {
  if (!readAloud.active) return;
  readAloud.paused = true;       // set state BEFORE cancel(), so the stale onend it triggers sees paused=true and does nothing
  speechToken++;                  // belt-and-suspenders: invalidate the in-flight utterance's callbacks too
  window.speechSynthesis.cancel();
  updateAudioBar();
  syncListenBtnState();
}

function resumeReadAloud() {
  if (!readAloud.active) return;
  readAloud.paused = false;
  updateAudioBar();
  syncListenBtnState();
  speakVerse(readAloud.verseIndex);
}

function stopReadAloud() {
  readAloud.active = false;      // set state BEFORE cancel(), same reasoning as pause
  readAloud.paused = false;
  speechToken++;
  if (speechSupported) window.speechSynthesis.cancel();
  readAloud = { active: false, paused: false, verseIndex: 0 };
  document.querySelectorAll('.verse-line.reading').forEach(el => el.classList.remove('reading'));
  updateAudioBar();
  syncListenBtnState();
}

function speakVerse(idx) {
  if (!readAloud.active || readAloud.paused) return;
  const data = bibleData[currentLang];
  const chapterVerses = data[currentBook][currentChapter];

  if (idx >= chapterVerses.length) {
    if (audioRepeatEnabled) { speakVerse(readAloudStartVerseIndex); return; }
    advanceChapterForReading();
    return;
  }

  readAloud.verseIndex = idx;
  readAloud.currentBook = currentBook;
  readAloud.currentChapter = currentChapter;

  document.querySelectorAll('.verse-line.reading').forEach(el => el.classList.remove('reading'));
  const verseEl = document.querySelector(`.verse-line[data-verse="${idx}"]`);
  if (verseEl) {
    verseEl.classList.add('reading');
    verseEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  updateAudioBar();

  speechToken++;
  const myToken = speechToken;
  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(chapterVerses[idx]);
  utterance.lang = currentLang === 'es' ? 'es-ES' : 'en-US';
  applyVoiceAndRate(utterance, currentLang);
  utterance.onend = () => {
    if (myToken !== speechToken) return; // a stale callback from a since-cancelled/replaced utterance — ignore
    if (readAloud.active && !readAloud.paused) speakVerse(idx + 1);
  };
  utterance.onerror = () => {
    if (myToken !== speechToken) return;
    if (readAloud.active && !readAloud.paused) speakVerse(idx + 1);
  };
  window.speechSynthesis.speak(utterance);
}

async function advanceChapterForReading() {
  const data = bibleData[currentLang];
  const chapterCount = data[currentBook].length;
  if (currentChapter < chapterCount - 1) {
    currentChapter += 1;
  } else if (currentBook < bookMeta.length - 1) {
    currentBook += 1;
    currentChapter = 0;
  } else {
    stopReadAloud();
    return;
  }
  saveLastPosition();
  await renderReadingView();
  speakVerse(0);
}

document.getElementById('audio-playpause-btn').onclick = () => {
